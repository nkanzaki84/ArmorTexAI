<div class="title-row" id="titleRow">
  <button class="btn sm ghost" id="backBtn" onclick="go(O.section === 'marketing' ? 'marketing' : 'partners')">← <?= section === 'marketing' ? 'Marketing' : 'Partners' ?></button>
  <h1 id="titleName">…</h1>
  <span id="titlePills"></span>
  <div class="spacer"></div>
  <span class="saved-stamp" id="savedStamp"></span>
  <button class="btn primary sm" id="saveAll" style="display:none" title="Saves next step, response and the profile (Enter in a box saves too)">💾 Save</button>
</div>
<div id="rec"><div class="empty">Loading…</div></div>

<script>
  (function () {
    var id = O.recordId;
    var data = null;
    if (!id) { $('rec').innerHTML = '<div class="empty">No partner selected.</div>'; return; }

    function profileValue(f, v) {
      if (v === '' || v === null || v === undefined) return '<span class="muted">—</span>';
      if (f.type === 'money') return esc(fmtMoney(v));
      return esc(v);
    }
    function profileInput(f, v) {
      var val = v === null || v === undefined ? '' : v;
      if (f.type === 'choice') return '<select name="' + esc(f.key) + '">' + f.options.map(function (o) { return '<option value="' + esc(o) + '"' + (String(val) === o ? ' selected' : '') + '>' + (o || '—') + '</option>'; }).join('') + '</select>';
      return '<input name="' + esc(f.key) + '" value="' + esc(val) + '" placeholder="' + esc(f.hint || '') + '"' + (f.type === 'number' ? ' inputmode="numeric"' : '') + '>';
    }

    function render() {
      var p = data.partner, m = data.metrics || {}, prof = data.profile || O.profiles[p.Type] || { label: p.Type, companyLabel: 'Company', fields: [], win: 'Sent an address', winVerb: 'won' };
      var dnc = String(p['Do Not Contact']).toLowerCase() === 'yes';
      var isPartner = p.Stage === 'Partner';
      $('titleName').textContent = p.Name;
      $('titlePills').innerHTML = '<span class="pill">' + esc(prof.label) + '</span> ' + verBadge(p.Version) + ' ' + stagePill(p.Stage) + ' ' + responsePill(p.Response) + (dnc ? ' <span class="pill bad">Do not contact</span>' : '') +
        (isPartner ? ' <span class="pill ok">🤝 partner' + (p['Partner Since'] ? ' since ' + fmtDate(p['Partner Since']) : '') + '</span>' : ' <span class="pill orange">📣 in marketing</span>');
      $('saveAll').style.display = canWrite ? '' : 'none';
      var html = '';

      // metrics strip: the numbers that matter for this type
      html += '<div class="stats">' +
        '<div class="stat"><b>' + m.emailsSent + '</b><span>emails sent</span></div>' +
        '<div class="stat"><b>' + m.replies + '</b><span>replies</span></div>' +
        '<div class="stat"><b>' + m.talked + '/' + m.calls + '</b><span>talked / calls' + (m.texts ? ' · ' + m.texts + ' texts' : '') + '</span></div>' +
        '<div class="stat"><b>' + m.referralsIn + '</b><span>' + esc(prof.winNoun || 'referrals') + ' in</span></div>' +
        '<div class="stat"><b>' + m.jobsSigned + '</b><span>jobs signed' + (m.jobValue ? ' · ' + fmtMoney(m.jobValue) : '') + '</span></div>' +
        '</div>';

      html += '<div class="actions">' +
        (p.Phone ? '<a class="btn" href="' + esc(callHref(p.Phone)) + '">📞 Call</a><a class="btn" href="' + esc(textHref(p.Phone)) + '">💬 Text</a>' : '<button class="btn" disabled>📞 No phone</button>') +
        (p.Email ? '<a class="btn" href="' + esc(gmailComposeUrl(p.Email)) + '" target="_blank" rel="noopener" title="Opens Gmail in a new tab">✉️ Email</a>' : '<button class="btn" disabled>✉️ No email</button>') +
        (canWrite ? '<button class="btn" id="logCallBtn">📝 Log call</button>' : '<button class="btn" disabled>📝 Log call</button>') + '</div>';
      if (canWrite) html += '<div class="row" style="margin:-4px 0 12px;justify-content:flex-end"><button class="btn sm ' + (p['Call Queue'] === 'Yes' ? 'ghost' : '') + '" id="queueBtn">' + (p['Call Queue'] === 'Yes' ? '✓ On the call list · remove' : '📞 Add to call list') + '</button>' + (isPartner
        ? '<button class="btn sm ghost" id="unmarkBtn">↩ Back to marketing</button>'
        : '<button class="btn sm navy" id="markBtn">🤝 Mark as partner · they ' + esc(prof.winVerb) + '</button>') + '</div>';

      // contact + next step
      html += '<div class="card"><div class="hd"><h2>Contact</h2><span class="sub">' + esc(prof.pitch || '') + '</span></div><div class="bd kv">' +
        '<div>' + esc(prof.companyLabel) + '</div><div>' + esc(p.Company || '—') + '</div>' +
        '<div>Phone</div><div>' + (fmtPhone(p.Phone) || '—') + '</div>' +
        '<div>Email</div><div>' + esc(p.Email || '—') + '</div>' +
        '<div>Area</div><div>' + esc(p.Area || '—') + '</div>' +
        '<div>Rep</div><div>' + (canWrite ? '<select class="inline-input" id="repSel"><option value="">— unassigned —</option></select>' : esc(p.Rep || '—')) + '</div>' +
        '<div>Last contact</div><div>' + (fmtDateTime(p['Last Contact']) || '—') + '</div>' +
        '<div>Next step</div><div>' + esc(p['Next Step'] || '—') + '</div>' +
        '<div>Notes</div><div>' + esc(p.Notes || '—') + '</div>' +
        '</div>' +
        (canWrite ? '<div class="ft"><form id="nsForm" class="row" style="flex:1"><input name="nextStep" type="text" placeholder="Next step, e.g. Call Tue" value="' + esc(p['Next Step'] || '') + '" class="inline-input" style="flex:1" title="Enter saves">' +
          '<select name="response" class="inline-input"><option value="">Response…</option>' + ['Replied', prof.win, 'Not interested'].map(function (r) { return '<option' + (p.Response === r ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') + '</select>' +
          '</form></div>' : '') + '</div>';

      // type profile: the facts Tanner wants before a call
      html += '<div class="card"><div class="hd"><h2>' + esc(prof.label) + ' profile</h2><span class="sub">what to know before the call</span></div>' +
        '<form class="bd" id="profForm"><div class="grid2">' +
        prof.fields.map(function (f) {
          return '<div class="f"><label>' + esc(f.key) + '</label>' + (canWrite ? profileInput(f, p[f.key]) : '<div>' + profileValue(f, p[f.key]) + '</div>') + (f.hint && canWrite ? '<span class="sub">' + esc(f.hint) + '</span>' : '') + '</div>';
        }).join('') +
        '</div>' + '<span class="hint">A win for a ' + esc(prof.label.toLowerCase()) + ' is when they have <b>' + esc(prof.winVerb) + '</b>.' + (canWrite ? ' Save with the button in the title row, or Enter.' : '') + '</span></form></div>';

      // log call form (hidden until pressed)
      html += '<div class="card" id="callCard" style="display:none"><div class="hd"><h2>Log a call</h2></div><form class="bd" id="callForm">' +
        '<div class="f"><label>Outcome</label><select name="outcome"><option value="talked">Talked</option><option value="voicemail">Left voicemail</option><option value="no_answer">No answer</option><option value="callback">Asked to call back</option><option value="not_interested">Not interested</option></select></div>' +
        '<div class="f"><label>Notes</label><input name="note" placeholder="What they said"></div>' +
        '<div class="row"><button class="btn primary" type="submit">Save call</button><button class="btn ghost" type="button" id="callCancel">Cancel</button></div></form></div>';

      html += '<div class="card"><div class="hd"><h2>Emails</h2><span class="sub">' + data.emails.length + '</span></div>' +
        (data.emails.length ? '<ul class="timeline" style="padding:6px 16px">' + data.emails.map(function (e) {
          return '<li><span class="when">' + (fmtDate(e['Sent At']) || fmtDate(e['Scheduled For']) || '') + '</span><span>' + verBadge(e.Version) + ' ' + esc(e.Step) + ' · <span class="pill">' + esc(e.Status) + '</span> ' + esc(e.Subject || '') + '</span></li>';
        }).join('') + '</ul>' : '<div class="empty">No emails yet.</div>') + '</div>';

      function fmtDur(sec) { sec = Number(sec) || 0; return sec >= 60 ? Math.floor(sec / 60) + 'm ' + (sec % 60) + 's' : sec + 's'; }
      function activityLine(ev) {
        var who = ev.By && ev.By !== 'quo' && ev.By !== 'trigger' ? ' <span class="sub">· ' + esc(String(ev.By).split('@')[0]) + '</span>' : '';
        if (ev.Kind === 'call' || ev.Kind === 'voicemail') {
          var arrow = ev.Direction === 'in' ? '📲 call in' : '📞 call';
          var oc = ev.Outcome || '';
          var pill = oc ? ' <span class="pill ' + (oc === 'talked' ? 'ok' : oc === 'missed' ? 'bad' : '') + '">' + esc(oc.replace('_', ' ')) + '</span>' : '';
          return '<b>' + arrow + '</b>' + pill + (ev.Duration ? ' <span class="sub">' + fmtDur(ev.Duration) + '</span>' : '') + who +
            (ev['Recording URL'] ? ' · <a href="' + esc(ev['Recording URL']) + '" target="_blank" rel="noopener">▶ recording</a>' : '') +
            (ev.Snippet ? '<div class="sub">' + esc(ev.Snippet) + '</div>' : '') +
            (ev.Transcript ? '<details style="margin-top:4px"><summary class="sub" style="cursor:pointer">Transcript</summary><div class="sub" style="white-space:pre-wrap">' + esc(ev.Transcript) + '</div></details>' : '');
        }
        if (ev.Kind === 'text') return '<b>' + (ev.Direction === 'in' ? '💬 text in' : '💬 text') + '</b>' + who + (ev.Snippet ? '<div class="sub" style="white-space:pre-wrap">' + esc(ev.Snippet) + '</div>' : '');
        return '<b>' + esc(ev.Kind) + '</b>' + (ev.Outcome ? ' · ' + esc(ev.Outcome) : '') + who + (ev.Snippet ? '<div class="sub">' + esc(ev.Snippet) + '</div>' : '');
      }
      html += '<div class="card"><div class="hd"><h2>Activity</h2></div>' +
        (data.events.length ? '<ul class="timeline" style="padding:6px 16px">' + data.events.slice().reverse().map(function (ev) {
          return '<li><span class="when">' + fmtDateTime(ev.At) + '</span><span>' + activityLine(ev) + '</span></li>';
        }).join('') + '</ul>' : '<div class="empty">Nothing logged yet.</div>') + '</div>';

      html += '<div class="card"><div class="hd"><h2>Referrals</h2><span class="sub">leads in and out · no fees, ever</span></div>' +
        (data.referrals.length ? '<ul class="timeline" style="padding:6px 16px">' + data.referrals.map(function (r) {
          return '<li><span class="when">' + fmtDate(r.Date) + '</span><span><span class="pill ' + (r.Direction === 'in' ? 'ok' : 'navy') + '">' + (r.Direction === 'in' ? 'they sent' : 'we sent') + '</span> ' + esc(r['Customer Or Address']) + (r['Listing Value'] ? ' · ' + fmtMoney(r['Listing Value']) : '') + (r['Signed Or Lost'] ? ' · ' + esc(r['Signed Or Lost']) : r.Outcome ? ' · ' + esc(r.Outcome) : '') + '</span></li>';
        }).join('') + '</ul>' : '<div class="empty">No referrals yet. Logging referrals arrives in version 4.</div>') + '</div>';

      if (canWrite) html += '<div class="row" style="justify-content:flex-end"><button class="btn sm ghost ' + (dnc ? '' : 'danger') + '" id="dncBtn">' + (dnc ? 'Allow contact again' : '🚫 Mark do-not-contact') + '</button></div>';
      $('rec').innerHTML = html;

      on($('logCallBtn'), 'click', function () { $('callCard').style.display = ''; });
      on($('callCancel'), 'click', function () { $('callCard').style.display = 'none'; });
      on($('callForm'), 'submit', function (e) { e.preventDefault(); api('logPartnerEvent', id, 'call', e.target.outcome.value, e.target.note.value).then(function () { toast('Call logged', 'success'); load(); }).catch(fail); });
      // One Save for the whole record (18): next step + response + profile. Enter in any box saves too (14).
      function saveAll() {
        var payload = {};
        var ns = $('nsForm'); if (ns) { payload.nextStep = ns.nextStep.value; payload.response = ns.response.value; }
        if ($('repSel')) payload.rep = $('repSel').value;
        var pf = $('profForm'); if (pf) { payload.profile = {}; prof.fields.forEach(function (f) { var el = pf.elements[f.key]; if (el) payload.profile[f.key] = el.value; }); }
        busy($('saveAll'), true, 'Saving…');
        api('savePartner', id, payload).then(function () { toast('Saved ' + p.Name, 'success'); stampSaved($('savedStamp')); load(); }).catch(fail).finally(function () { busy($('saveAll'), false, '💾 Save'); });
      }
      on($('nsForm'), 'submit', function (e) { e.preventDefault(); saveAll(); });
      on($('profForm'), 'submit', function (e) { e.preventDefault(); saveAll(); });
      $('saveAll').onclick = saveAll;
      on($('queueBtn'), 'click', function () { api('setCallQueue', id, p['Call Queue'] !== 'Yes').then(function () { toast(p['Call Queue'] === 'Yes' ? 'Off the call list' : 'On the call list', 'success'); load(); }).catch(fail); });
      if ($('repSel')) api('listTeamContacts').then(function (team) {
        $('repSel').innerHTML = '<option value="">— unassigned —</option>' + team.map(function (u) { return '<option value="' + esc(u.email) + '"' + (String(p.Rep || '').toLowerCase() === u.email ? ' selected' : '') + '>' + esc(u.name || u.email) + '</option>'; }).join('');
      }).catch(function () { if ($('repSel')) $('repSel').innerHTML = '<option value="' + esc(p.Rep || '') + '">' + esc(p.Rep || '— unassigned —') + '</option>'; });
      on($('markBtn'), 'click', function () { if (!confirm('Move ' + p.Name + ' into the Partners book?')) return; api('markAsPartner', id).then(function () { toast('Now a partner', 'success'); load(); }).catch(fail); });
      on($('unmarkBtn'), 'click', function () { if (!confirm('Send ' + p.Name + ' back to the marketing pipeline?')) return; api('unmarkPartner', id).then(function () { toast('Back in marketing', 'success'); load(); }).catch(fail); });
      on($('dncBtn'), 'click', function () {
        var msg = dnc ? 'Allow contacting ' + p.Name + ' again?' : 'Mark ' + p.Name + ' do-not-contact? Queued emails are cancelled and they are never emailed again.';
        if (!confirm(msg)) return;
        api('setPartnerDoNotContact', id, !dnc, 'from partner record').then(function () { toast(dnc ? 'Contact allowed again' : 'Marked do-not-contact', 'success'); load(); }).catch(fail);
      });
    }
    function load() { api('getPartner', id).then(function (d) { data = d; render(); }).catch(function (e) { $('rec').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }); }
    load();
  })();
</script>
