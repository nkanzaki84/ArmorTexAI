<script>
  // ---------- shared client helpers (included on every page) ----------
  var O = window.OUTREACH;

  // ===== /dev ↔ /exec link switcher (owner tool, from SFM) =====
  // /exec is Tanner's pinned deployment; /dev runs the last clasp push. The
  // server can't tell which door the page came through, so the client keeps a
  // sticky "use /dev links" flag: set automatically when the browser came from
  // a /dev address, or by hand with "Links: /dev" in the owner tools. Every
  // link and go() then stays on the same door.
  window.APP_EXEC_URL = O.appUrl;
  window.APP_DEV_URL = O.appDevUrl || O.appUrl;
  (function () {
    var KEY = 'atx_dev_links';
    var ref = '';
    try { ref = String(document.referrer || ''); } catch (e) { ref = ''; }
    try {
      if (O.isDev || /\/dev(\?|#|$)/.test(ref)) localStorage.setItem(KEY, '1');
      else if (/\/exec(\?|#|$)/.test(ref)) localStorage.removeItem(KEY);
    } catch (e) {}
    window.useDevLinks = function () { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } };
    window.setDevLinks = function (on) {
      try { if (on) localStorage.setItem(KEY, '1'); else localStorage.removeItem(KEY); } catch (e) {}
      window.APP_URL = on ? window.APP_DEV_URL : window.APP_EXEC_URL;
    };
    window.APP_URL = useDevLinks() ? window.APP_DEV_URL : window.APP_EXEC_URL;
  })();
  // Server-rendered links are written with the /exec base; swap them once the DOM is ready.
  document.addEventListener('DOMContentLoaded', function () {
    if (window.APP_URL === window.APP_EXEC_URL) return;
    Array.prototype.forEach.call(document.querySelectorAll('a[href]'), function (a) {
      var h = a.getAttribute('href') || '';
      if (h.indexOf(window.APP_EXEC_URL) === 0) a.setAttribute('href', window.APP_URL + h.substring(window.APP_EXEC_URL.length));
    });
  });

  // ===== Dev Mode (owner tool): a sticky flag pages can read to show preview UIs =====
  window.isDevMode = function () { try { return localStorage.getItem('atx_dev_mode') === '1'; } catch (e) { return false; } };
  window.setDevMode = function (on) {
    try { if (on) localStorage.setItem('atx_dev_mode', '1'); else localStorage.removeItem('atx_dev_mode'); } catch (e) { alert('Could not save Dev Mode: ' + (e.message || e)); return; }
    reloadApp();
  };
  window.reloadApp = function () {
    try { window.top.location.reload(); } catch (e1) { try { window.location.reload(); } catch (e2) { alert('Please reload the page.'); } }
  };
  document.addEventListener('DOMContentLoaded', function () {
    if (!isDevMode()) return;
    var banner = document.createElement('div');
    banner.id = 'devModeBanner';
    banner.innerHTML = '🔧 <strong>DEV MODE</strong> — preview UIs may be shown. Turn off in the owner tools.';
    banner.style.cssText = 'position:sticky; top:0; z-index:200; background:#fef3c7; color:#78350f; padding:6px 14px; font-size:12px; border-bottom:1px solid #f0d97a;';
    document.body.insertBefore(banner, document.body.firstChild);
  });

  /** Call a server function, get a Promise. api('listPartners', {q:'kw'}) */
  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err instanceof Error ? err : new Error(err && err.message ? err.message : String(err))); });
      runner[name].apply(runner, args);
    });
  }

  function go(page, params) {
    var url = window.APP_URL + '?page=' + encodeURIComponent(page) + '&side=' + encodeURIComponent(O.side);
    Object.keys(params || {}).forEach(function (k) { url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); });
    window.top.location.href = url;
  }

  var _toastTimer = null;
  function toast(msg, kind) {
    var t = document.getElementById('toast');
    if (!t) { alert(msg); return; }
    t.textContent = msg; t.className = 'toast show' + (kind === 'bad' ? ' bad' : '');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function () { t.className = 'toast'; }, kind === 'bad' ? 6000 : 3000);
  }
  function fail(err) { console.error(err); toast(err && err.message ? err.message : String(err), 'bad'); }

  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtPhone(d) { d = String(d || '').replace(/\D/g, ''); return d.length === 10 ? '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6) : (d || ''); }
  function fmtDate(v) { if (!v) return ''; var d = new Date(v); if (isNaN(d)) return String(v); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
  function fmtDateTime(v) { if (!v) return ''; var d = new Date(v); if (isNaN(d)) return String(v); return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
  function pct(n) { return (Math.round(n * 1000) / 10) + '%'; }
  function verBadge(v) { return '<span class="ver ' + (v ? esc(v) : 'none') + '">' + (v ? esc(v) : '–') + '</span>'; }
  function stagePill(s) {
    var k = { Prospect: '', Contacted: 'navy', Replied: 'orange', Partner: 'ok', Target: '', Mailed: 'navy', Knocked: 'navy', Talked: 'orange', 'Roof check booked': 'ok' }[s] || '';
    return '<span class="pill ' + k + '">' + esc(s || '—') + '</span>';
  }
  function responsePill(r) {
    if (!r) return '';
    var k = { Replied: 'orange', 'Sent an address': 'ok', 'Not interested': 'bad', Bounced: 'bad', 'Opted out': 'bad' }[r] || '';
    return '<span class="pill ' + k + '">' + esc(r) + '</span>';
  }
  function $(id) { return document.getElementById(id); }
  function on(el, ev, fn) { if (el) el.addEventListener(ev, fn); }
  function busy(btn, yes, label) { if (!btn) return; btn.disabled = !!yes; if (label !== undefined) btn.textContent = label; }
  var canWrite = !!(O.session && O.session.canWrite);
  var isAdmin = !!(O.session && O.session.isAdmin);
</script>
