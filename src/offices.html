<div class="title-row" style="position:static">
  <h1>Offices</h1><span class="sub">🏢 brokerages · one visit touches every agent there</span>
  <div class="spacer"></div>
  <span class="chips" id="offFilter"><button class="chip on" data-f="">All</button><button class="chip" data-f="never">Never visited</button><button class="chip" data-f="replied">Have replies</button></span>
</div>
<div class="row" style="margin-bottom:12px"><div class="search">🔍 <input id="q" placeholder="Search offices…"></div><div class="spacer"></div><span class="sub" id="offCount"></span><button class="btn sm ghost" id="mergeBtn" style="display:none">⧉ Merge two offices</button></div>

<div class="card">
  <div class="scroll-x"><table>
    <thead><tr><th>Office</th><th class="num">Agents</th><th class="num">Emailed</th><th class="num">Replied</th><th class="num">Partners</th><th>Last visit</th><th></th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
  </table></div>
  <div class="ft"><span class="sub">Offices come from the Company on each person; spellings that differ get their own row until you merge them. Sorted by most agents.</span></div>
</div>

<script>
  (function () {
    var all = [], f = '', q = '';
    if (isAdmin) $('mergeBtn').style.display = '';
    function daysAgo(v) { if (!v) return null; return Math.floor((Date.now() - new Date(v).getTime()) / 86400000); }
    function render() {
      var rows = all.filter(function (o) {
        if (f === 'never' && o.visits) return false;
        if (f === 'replied' && !o.replied) return false;
        if (q && (o.name + ' ' + o.address + ' ' + o.manager + ' ' + o.aliases.join(' ')).toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
      $('offCount').textContent = rows.length + ' of ' + all.length;
      $('rows').innerHTML = rows.length ? rows.map(function (o) {
        var d = daysAgo(o.lastVisit);
        return '<tr class="link" data-id="' + esc(o.id) + '"><td><b>' + esc(o.name) + '</b>' + (o.address ? '<div class="sub">' + esc(o.address) + '</div>' : '') + (o.manager ? '<div class="sub">👤 ' + esc(o.manager) + '</div>' : '') + '</td>' +
          '<td class="num">' + o.agents + '</td><td class="num">' + o.emailed + '</td><td class="num">' + (o.replied ? '<b>' + o.replied + '</b>' : '0') + '</td><td class="num">' + (o.partners ? '🤝 ' + o.partners : '0') + '</td>' +
          '<td>' + (o.lastVisit ? fmtDate(o.lastVisit) + ' <span class="sub">· ' + d + 'd ago · ' + o.visits + ' visit' + (o.visits === 1 ? '' : 's') + '</span>' : '<span class="pill warn">never</span>') + '</td><td>›</td></tr>';
      }).join('') : '<tr><td colspan="7" class="empty">' + (all.length ? 'Nothing matches.' : 'No offices yet. They appear as soon as prospects with a company are imported.') + '</td></tr>';
    }
    on($('rows'), 'click', function (e) { var tr = e.target.closest('tr[data-id]'); if (tr) go('office', { id: tr.dataset.id }); });
    on($('offFilter'), 'click', function (e) { var c = e.target.closest('.chip'); if (!c) return; $('offFilter').querySelectorAll('.chip').forEach(function (x) { x.classList.remove('on'); }); c.classList.add('on'); f = c.dataset.f; render(); });
    on($('q'), 'input', function (e) { q = e.target.value.trim().toLowerCase(); render(); });
    on($('mergeBtn'), 'click', function () {
      var lines = all.map(function (o, i) { return (i + 1) + '. ' + o.name + ' (' + o.agents + ')'; }).join('\n');
      var keep = prompt('Merge two offices. Which one to KEEP? (number)\n\n' + lines); if (keep === null) return;
      var gone = prompt('And which one folds INTO it? (number)'); if (gone === null) return;
      var a = all[parseInt(keep, 10) - 1], b = all[parseInt(gone, 10) - 1];
      if (!a || !b || a === b) { toast('Pick two different numbers', 'error'); return; }
      if (!confirm('Fold “' + b.name + '” into “' + a.name + '”? Its agents and visits move over; “' + b.name + '” becomes a spelling of “' + a.name + '”.')) return;
      api('mergeOffices', a.id, b.id).then(function () { toast('Merged', 'success'); load(); }).catch(fail);
    });
    function load() { api('listOffices').then(function (rows) { all = rows; render(); }).catch(function (e) { $('rows').innerHTML = '<tr><td colspan="7" class="empty">' + esc(e.message) + '</td></tr>'; }); }
    load();
  })();
</script>
