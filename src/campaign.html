<div class="title-row" id="titleRow">
  <a class="btn sm ghost" href="#" onclick="go('campaigns'); return false;">← Campaigns</a>
  <h1 id="titleName">…</h1>
  <span id="titlePills"></span>
  <div class="spacer"></div>
  <span class="sub" id="savedStamp"></span>
  <button class="btn ghost" id="dupBtn" style="display:none" title="A new draft with this wording and plan, pointed at a list you choose">⧉ Duplicate</button>
  <button class="btn ghost" id="doneBtn" style="display:none" title="Nothing more to send: file it. Numbers and results stay.">✓ Mark done</button>
  <button class="btn" id="statusBtn" style="display:none"></button>
  <button class="btn navy" id="sendNowBtn" style="display:none" title="Owner only: send this campaign's batch now, even if today is not a sending day">📨 Send now</button>
  <button class="btn primary" id="saveAll" style="display:none">💾 Save</button>
</div>

<div class="ptabs" id="tabs">
  <button class="on" data-tab="overview">Overview</button>
  <button data-tab="audience">Audience <span class="n" id="nAud">–</span></button>
  <button data-tab="copy">Email <span class="n" id="nCopy" style="display:none">–</span></button>
  <button data-tab="schedule">Schedule</button>
  <button data-tab="results">Results <span class="n" id="nRes">–</span></button>
</div>

<div id="tab-overview" class="tabpane"><div class="empty">Loading…</div></div>
<div id="tab-audience" class="tabpane" style="display:none"></div>
<div id="tab-copy" class="tabpane" style="display:none"></div>
<div id="tab-schedule" class="tabpane" style="display:none"></div>
<div id="tab-results" class="tabpane" style="display:none"></div>

<script>
  (function () {
    var id = O.recordId;
    if (!id) { $('tab-overview').innerHTML = '<div class="empty">No campaign chosen.</div>'; return; }
    var data = null, results = null, resultFilter = 'all';
    var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    function multi() { return data && data.campaign.versions.length > 1; }   // comparing wordings? letters only show then
    function statusPill(s) { return '<span class="pill ' + ({ running: 'ok', paused: 'warn', done: 'navy', draft: '' }[s] || '') + '">' + esc(s) + '</span>'; }
    function nextStatus(s) { return s === 'running' ? { to: 'paused', label: '⏸ Pause' } : s === 'done' ? null : { to: 'running', label: '▶ ' + (s === 'paused' ? 'Resume' : 'Start sending') }; }

    // ---- tabs ----
    on($('tabs'), 'click', function (e) {
      var b = e.target.closest('button[data-tab]'); if (!b) return;
      $('tabs').querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.querySelectorAll('.tabpane').forEach(function (p) { p.style.display = p.id === 'tab-' + b.dataset.tab ? '' : 'none'; });
      if (b.dataset.tab === 'results' && !results) loadResults();
      try { localStorage.setItem('cp-tab-' + id, b.dataset.tab); } catch (err) {}
    });

    // ---- overview ----
    function renderOverview() {
      var c = data.campaign, s = data.stats, plan = data.plan;
      var due = plan.days.length ? plan.days[0] : null;
      var html = '<div class="stats">' +
        '<div class="stat"><b>' + c.audience + '</b><span>audience' + (c.dealt < c.audience ? ' · ' + (c.audience - c.dealt) + ' undealt' : '') + '</span></div>' +
        '<div class="stat"><b>' + c.sent + '</b><span>sent' + (c.audience ? ' · ' + pct(c.sent / c.audience) : '') + '</span></div>' +
        '<div class="stat"><b>' + c.replied + '</b><span>replied' + (c.sent ? ' · ' + pct(c.replyRate) : '') + '</span></div>' +
        '<div class="stat"><b>' + c.wins + '</b><span>' + esc(c.winNoun) + '</span></div>' +
        '<div class="stat"><b>' + plan.followUpsQueued + '</b><span>follow-ups queued</span></div>' +
        '<div class="stat"><b>' + plan.days.length + '</b><span>sending days left</span></div></div>';
      var cell = function (n, rate) { return '<td class="num">' + n + (rate !== undefined ? ' <span class="sub">' + pct(rate) + '</span>' : '') + '</td>'; };
      var m = multi();
      html += '<div class="card"><div class="hd"><h2>' + (m ? 'By wording' : 'Results') + '</h2><span class="sub">counts beside every rate</span></div>' +
        (s.rows.length ? '<div class="scroll-x"><table><thead><tr>' + (m ? '<th>Wording</th>' : '') + '<th class="num">In</th><th class="num">Sent</th><th class="num">Follow-ups</th><th class="num">Replied</th><th class="num">' + esc(c.winNoun) + '</th><th class="num">Not interested</th><th class="num">Bounced</th><th class="num">Opted out</th></tr></thead><tbody>' +
          s.rows.map(function (r) { return '<tr>' + (m ? '<td>' + verBadge(r.version) + '</td>' : '') + cell(r.assigned) + cell(r.sent) + cell(r.followUps) + cell(r.replied, r.replyRate) + cell(r.addresses, r.addressRate) + cell(r.notInterested || 0) + cell(r.bounced) + cell(r.optedOut) + '</tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">Nobody in the campaign yet. See the Audience tab.</div>') +
        (m ? '<div class="ft"><span class="sub">' + esc(s.note) + '</span></div>' : '') + '</div>';
      html += '<div class="grid2"><div class="card"><div class="hd"><h2>Next send</h2></div><div class="bd">' +
        (c.status !== 'running' ? '<div class="sub">Not running. ' + (c.status === 'draft' ? 'Add people on Audience, write the email on Copy, then press Start sending.' : c.status === 'paused' ? 'Press Resume to put it back on Today.' : 'This campaign is finished.') + '</div>' :
          due ? '<b>' + esc(due.weekday) + ' ' + fmtDate(due.date) + '</b> · ' + due.firsts + ' first email' + (due.firsts === 1 ? '' : 's') + (due.followUps ? ' + ' + due.followUps + ' follow-up' + (due.followUps === 1 ? '' : 's') : '') + '<div class="sub" style="margin-top:6px">Shows on Today. A person presses Send; nothing goes out on its own.' + (isAdmin ? ' Or press Send now in the title row to send this campaign\'s batch today.' : '') + '</div>' : '<div class="sub">Nothing left to send. ' + (plan.followUpsQueued ? plan.followUpsQueued + ' follow-ups are still queued.' : 'Everyone has been emailed.') + '</div>') +
        '<div class="row" style="margin-top:10px"><a class="btn sm" href="#" onclick="go(\'today\'); return false;">☀️ Open Today</a></div></div></div>' +
        '<div class="card"><div class="hd"><h2>Plan</h2></div><div class="bd"><div>' + c.cap + ' a day · ' + esc(c.days) + '</div><div class="sub">Email → follow-up email after ' + c.followUpDays + ' business days → ' + (c.callAfterDays ? 'call after ' + c.callAfterDays + ' business days if no reply' : 'no call step (set one on Schedule)') + (c.visitAfterDays ? ' → stop by the office after ' + c.visitAfterDays : '') + '. Anyone who replies gets a call right away.</div>' +
        (c.startDate ? '<div class="sub">Starts ' + fmtDate(c.startDate) + '</div>' : '') + (plan.finish ? '<div class="sub">Finishes about ' + fmtDate(plan.finish) + ' at this pace.</div>' : '') +
        (c.notes ? '<div class="sub" style="margin-top:6px;white-space:pre-wrap">' + esc(c.notes) + '</div>' : '') + '</div></div></div>';
      $('tab-overview').innerHTML = html;
    }

    // ---- audience ----
    function renderAudience() {
      var c = data.campaign, a = data.audience;
      var chip = function (v, label, on) { return '<label class="chip ' + (on ? 'on' : '') + '"><input type="checkbox" value="' + esc(v) + '" hidden' + (on ? ' checked' : '') + '> ' + esc(label) + '</label>'; };
      var ex = Object.keys(a.excluded).map(function (k, i) { return '<a href="#" class="ex-why" data-why="' + esc(k) + '">' + a.excluded[k] + ' ' + esc(k) + '</a>'; }).join(' · ');
      var curated = data.curated || [];
      var html = '<div class="card"><div class="hd"><h2>Who is in it</h2><span class="sub">' + esc(c.typeLabel) + ' · pick lists, then Save</span><div class="spacer"></div><a class="btn sm ghost" href="#" onclick="go(\'lists\'); return false;">📋 Manage lists</a></div><div class="bd">' +
        '<div class="f"><label>Lists</label><div class="row" id="audLists">' + (curated.map(function (l) { return chip(l.id, l.name + ' · ' + l.count, c.lists.indexOf(l.id) !== -1); }).join('') || '<span class="sub">No lists yet. Make one under Lists, or use an import file below.</span>') + '</div><span class="sub">Ticked lists add up. None ticked = everyone of this type.</span></div>' +
        ((data.earlier || []).length ? '<div class="f"><label>People from an earlier campaign who never replied</label><div class="row" id="audEarlier">' + data.earlier.map(function (x) { return chip(x.id, x.name + ' · ' + x.noReply + ' no reply' + (x.status !== 'done' ? ' · ' + x.status : ''), c.lists.indexOf(x.id) !== -1); }).join('') + '</div><span class="sub">A series: Part 2 goes to Part 1\'s silent ones with a new angle. People are free once the earlier campaign is marked done, and never within ' + (data.reengageDays || 90) + ' days of their last email.</span></div>' : '') +
        '<details style="margin:4px 0 10px"><summary class="sub" style="cursor:pointer">Import files (the file a person arrived in)</summary><div class="row" id="audSources" style="margin-top:6px">' + (data.lists.map(function (l) { return chip(l.sourceList, l.sourceList + ' · ' + l.count, c.lists.indexOf(l.sourceList) !== -1); }).join('') || '<span class="sub">nothing imported yet</span>') + '</div></details>' +
        '<div id="audStages" style="display:none">' + data.stageOptions.map(function (s) { return chip(s, s, c.stages.indexOf(s) !== -1); }).join('') + '</div>' +
        '<div class="ok-box"><b>' + a.members.length + ' in this campaign</b>' + (a.undealt ? ' · <b>' + a.undealt + '</b> match the filters and are not in yet' : '') + (ex ? '<div class="sub" style="margin-top:4px">Left out: ' + ex + ' <span class="sub">(click one to see who)</span></div>' : '') + '</div>' +
        '<div id="exWho" style="display:none;margin-top:8px"></div>' +
        '</div></div>';
      var counts = Object.keys(a.counts).filter(function (k) { return k !== 'none'; }).map(function (k) { return '<span class="pill">' + esc(k) + ' · ' + a.counts[k] + '</span>'; }).join(' ');
      var m = multi();
      html += '<div class="card"><div class="hd"><h2>People in it</h2><span class="sub">once in, they stay in; the email goes to each of them once</span><div class="spacer"></div><span class="pill ' + (a.undealt || a.counts.none ? 'warn' : 'ok') + '">' + (a.members.length - (a.counts.none || 0)) + ' of ' + (a.members.length + a.undealt) + ' in</span></div><div class="bd">' +
        '<div class="row">' + (isAdmin ? '<button class="btn navy" id="dealBtn"' + (a.undealt || a.counts.none ? '' : ' disabled') + '>' + (a.undealt ? 'Add the ' + a.undealt + ' who match' : 'Everyone who matches is in') + '</button>' : '') +
        '<span id="audLetters" class="chips" style="' + (m ? '' : 'display:none') + '"><span class="sub">Wordings:</span>' + data.letterOptions.map(function (l) { return chip(l, l, c.versions.indexOf(l) !== -1); }).join('') + '</span></div>' +
        '<div class="sub" style="margin:6px 0">' + (m ? 'People are shuffled within each brokerage and dealt across the wordings in turn, so the comparison is fair. A wording is permanent once dealt.' : 'Everyone on the ticked lists who is not in the Partners book, not emailed by hand, not opted out, and not emailed in the last cooling-off days.') + '</div>' +
        (m && counts ? '<div class="row">' + counts + '</div>' : '') + '<div id="dealResult"></div></div>' +
        '<div class="hd" style="border-top:1px solid var(--line)"><input class="inline-input" id="audSearch" placeholder="🔍 Search name, brokerage…" style="max-width:320px"><div class="spacer"></div><span class="sub">' + a.members.length + ' people</span></div>' +
        '<div class="scroll-x"><table class="tight"><thead><tr>' + (m ? '<th>Wording</th>' : '') + '<th>Name</th><th>' + esc((O.profiles[c.type] || {}).companyLabel || 'Company') + '</th><th>Area</th><th>Stage</th><th>Rep</th><th></th></tr></thead><tbody id="audRows"></tbody></table></div></div>';
      $('tab-audience').innerHTML = html;
      renderAudRows('');
      on($('audSearch'), 'input', function () { renderAudRows($('audSearch').value); });
      on($('tab-audience'), 'click', function (e) {
        var ch = e.target.closest('label.chip'); if (ch && ch.querySelector('input')) { setTimeout(function () { ch.classList.toggle('on', ch.querySelector('input').checked); markDirty(); }, 0); }
        var rm = e.target.closest('[data-remove]'); if (rm) { e.stopPropagation(); if (!confirm('Take this person out of the campaign?')) return; api('removeFromCampaign', id, rm.dataset.remove).then(function () { toast('Removed', 'success'); load(); }).catch(fail); return; }
        var tr = e.target.closest('tr[data-id]'); if (tr) go('partner', { id: tr.dataset.id, from: 'prospects' });
        var link = e.target.closest('a.ex-why');
        if (link) {
          e.preventDefault();
          var why = link.dataset.why, people = (a.excludedPeople || {})[why] || [];
          $('exWho').innerHTML = '<div class="card" style="margin:0"><div class="hd"><h3 style="margin:0">' + people.length + ' ' + esc(why) + '</h3><div class="spacer"></div><button class="btn sm ghost" type="button" id="exClose">✕</button></div>' +
            '<ul class="list" style="max-height:300px;overflow:auto">' + people.map(function (p) { return '<li class="link" data-id="' + esc(p.ID) + '"><div style="flex:1;min-width:0"><div class="name">' + esc(p.Name) + '</div><div class="sub">' + esc(p.Company || '') + (p.lastSent ? ' · last emailed ' + fmtDate(p.lastSent) : '') + '</div></div><span class="sub">›</span></li>'; }).join('') + '</ul>' +
            (why.indexOf('emailed in the last') === 0 ? '<div class="bd sub">The cooling-off (Settings → Sending) keeps anyone from getting a second pitch too soon, even from a different campaign. Lower it to 0 if you really want them now.</div>' : '') + '</div>';
          $('exWho').style.display = '';
          on($('exClose'), 'click', function () { $('exWho').style.display = 'none'; });
          $('exWho').querySelector('ul').addEventListener('click', function (ev) { var li = ev.target.closest('li[data-id]'); if (li) go('partner', { id: li.dataset.id, from: 'prospects' }); });
        }
      });
      if ($('dealBtn')) on($('dealBtn'), 'click', function () {
        var letters = picked($('audLetters'));
        if (!letters.length) return toast('Pick at least one wording', 'error');
        if (!confirm('Add everyone who matches? Once in, they stay in.')) return;
        busy($('dealBtn'), true, 'Adding…');
        saveFilters().then(function () { return api('dealLetters', id, { versions: letters }); }).then(function (r) {
          $('dealResult').innerHTML = '<div class="ok-box">Added <b>' + r.dealt + '</b>' + (multi() ? ': ' + Object.keys(r.counts).map(function (v) { return v + ' ' + r.counts[v]; }).join(' · ') : '') + '.</div>';
          toast('Added ' + r.dealt, 'success'); load();
        }).catch(fail).finally(function () { busy($('dealBtn'), false, 'Add the people who match'); });
      });
    }
    function renderAudRows(q) {
      q = String(q || '').toLowerCase();
      var rows = data.audience.members.filter(function (m) { return !q || [m.Name, m.Company, m.Area, m.Email].join(' ').toLowerCase().indexOf(q) !== -1; });
      $('audRows').innerHTML = rows.length ? rows.slice(0, 300).map(function (m) {
        return '<tr class="link" data-id="' + esc(m.ID) + '">' + (multi() ? '<td>' + verBadge(m.Version) + '</td>' : '') + '<td>' + esc(m.Name) + '</td><td>' + esc(m.Company || '') + '</td><td>' + esc(m.Area || '') + '</td><td>' + stagePill(m.Stage) + '</td><td class="sub">' + esc(String(m.Rep || '').split('@')[0]) + '</td><td>' + (isAdmin ? '<button class="btn sm ghost" data-remove="' + esc(m.ID) + '" title="Only possible before anything is sent">✕</button>' : '') + '</td></tr>';
      }).join('') + (rows.length > 300 ? '<tr><td colspan="7" class="sub">… ' + (rows.length - 300) + ' more; narrow the search</td></tr>' : '') : '<tr><td colspan="7" class="empty">' + (data.audience.members.length ? 'No match.' : 'Nobody in the campaign yet. Tick a list above, Save, then add the people who match.') + '</td></tr>';
    }
    function picked(box) { return Array.prototype.map.call(box.querySelectorAll('input:checked'), function (i) { return i.value; }); }

    // ---- copy ----
    function renderCopy() {
      var c = data.campaign, vs = data.versions.filter(function (v) { return c.versions.indexOf(String(v.Letter)) !== -1; });
      var anyLocked = vs.some(function (v) { return String(v.Locked).toLowerCase() === 'yes'; });
      var m = multi();
      var html = '<div class="card"><div class="hd"><h2>' + (m ? 'Wordings' : 'The email') + '</h2><span class="sub">plain text · street address + opt-out line · ends with a question · {{first}} {{name}} {{company}} {{area}} are filled in</span><div class="spacer"></div><span class="sub">' + (anyLocked ? '🔒 locked: sending has started' : 'editable until the first send') + '</span></div>' +
        (vs.length ? vs.map(function (v) {
          var locked = String(v.Locked).toLowerCase() === 'yes';
          var ro = (!isAdmin || locked) ? ' readonly' : '';
          return (m ? '<details class="card" style="margin:10px 12px;box-shadow:none"><summary>' + verBadge(v.Letter) + '<span>' + esc(v.Angle || 'untitled') + '</span><span class="sub">' + esc(v.Subject || 'no subject yet') + '</span>' + (locked ? '<span class="pill">locked</span>' : (!String(v.Body || '').trim() ? '<span class="pill warn">empty</span>' : '')) + (isAdmin && !locked ? '<span class="spacer"></span><button type="button" class="btn sm ghost" data-remove-wording="' + esc(v.Letter) + '" title="Nobody was emailed with this wording yet">Remove</button>' : '') + '</summary>' : '<div>') +
            '<form class="bd verForm" data-letter="' + esc(v.Letter) + '">' +
            (m ? '<div class="grid2"><div class="f"><label>Angle</label><input name="angle" value="' + esc(v.Angle) + '"' + ro + '></div><div class="f"><label>Subject</label><input name="subject" value="' + esc(v.Subject) + '"' + ro + '></div></div>' : '<input type="hidden" name="angle" value="' + esc(v.Angle) + '"><div class="f"><label>Subject</label><input name="subject" value="' + esc(v.Subject) + '"' + ro + '></div>') +
            '<div class="f"><label>First email</label><textarea name="body" style="min-height:220px"' + ro + '>' + esc(v.Body) + '</textarea></div>' +
            '<div class="f"><label>Follow-up (same thread, ' + c.followUpDays + ' business days later, only one)</label><textarea name="followUpBody" style="min-height:80px"' + ro + '>' + esc(v['Follow Up Body']) + '</textarea></div>' +
            '<div class="problems"></div>' +
            (isAdmin && !locked ? '<div class="row"><button class="btn primary" type="submit">' + (m ? 'Save wording ' + esc(v.Letter) : 'Save email') + '</button><span class="sub">Saving checks the footer rules.</span></div>' : '') + '</form>' + (m ? '</details>' : '</div>');
        }).join('') : '<div class="empty">No wording yet.</div>') +
        (isAdmin && !m && !anyLocked ? '<div class="ft"><a href="#" id="compareLink" class="sub">Want to test a second wording on the same people? Add wording B</a></div>' : '') + '</div>';
      $('tab-copy').innerHTML = html;
      if ($('compareLink')) on($('compareLink'), 'click', function (e) {
        e.preventDefault();
        if (!confirm('Add a second wording (B)? People added from now on are split evenly between A and B so you can compare reply rates.')) return;
        api('saveCampaign', id, { versions: data.campaign.versions.concat(['B']) }).then(function () { toast('Wording B added', 'success'); load(); }).catch(fail);
      });
      $('tab-copy').querySelectorAll('[data-remove-wording]').forEach(function (b) {
        b.addEventListener('click', function (e) {
          e.preventDefault(); e.stopPropagation();
          var L = b.dataset.removeWording;
          if (!confirm('Remove wording ' + L + '? Anyone holding it is dealt one of the other wordings instead.')) return;
          api('removeWording', id, L).then(function (r) { toast('Wording ' + L + ' removed' + (r.redealt ? ' · ' + r.redealt + ' re-dealt' : ''), 'success'); load(); }).catch(fail);
        });
      });
      $('tab-copy').querySelectorAll('.verForm').forEach(function (f) {
        f.addEventListener('submit', function (e) {
          e.preventDefault();
          var btn = f.querySelector('[type=submit]'); busy(btn, true, 'Saving…');
          api('saveVersion', f.dataset.letter, { angle: f.angle.value, subject: f.subject.value, body: f.body.value, followUpBody: f.followUpBody.value }, id).then(function (r) {
            f.querySelector('.problems').innerHTML = r.problems.length ? r.problems.map(function (p) { return '<div class="problem">' + esc(p) + '</div>'; }).join('') : '<div class="ok-box">✓ Passes the footer and plain-text rules.</div>';
            toast('Saved', 'success');
          }).catch(fail).finally(function () { busy(btn, false, multi() ? 'Save wording ' + f.dataset.letter : 'Save email'); });
        });
      });
    }

    // ---- schedule ----
    function renderSchedule() {
      var c = data.campaign, raw = data.raw, sd = data.sending, plan = data.plan;
      var dayChips = DAYS.map(function (d) { var onIt = sd.days.indexOf(d.toLowerCase()) !== -1; return '<label class="chip ' + (onIt ? 'on' : '') + '"><input type="checkbox" value="' + d + '" hidden' + (onIt ? ' checked' : '') + '> ' + d + '</label>'; }).join('');
      // (chips stay on one line: label.chip is inline-flex in styles.html)
      var dis = isAdmin ? '' : ' disabled';
      var html = '<div class="grid2"><div class="card"><div class="hd"><h2>Plan</h2><span class="sub">what Today will offer, day by day</span></div><form class="bd" id="schedForm">' +
        '<div class="grid2"><div class="f"><label>Start</label><input name="startDate" type="date" value="' + esc(raw['Start Date'] ? String(raw['Start Date']).slice(0, 10) : '') + '"' + dis + '><span class="sub">Blank = as soon as it runs.</span></div>' +
        '<div class="f"><label>Daily cap</label><input name="dailyCap" type="number" min="0" max="1500" value="' + esc(raw['Daily Cap'] === '' ? '' : raw['Daily Cap']) + '" placeholder="' + sd.cap + ' (Settings)"' + dis + '><span class="sub">Blank = Settings (' + sd.cap + ').</span></div></div>' +
        '<div class="f"><label>Sending days</label><div class="row" id="schedDays">' + dayChips + '</div><span class="sub">' + (sd.inherited.days ? 'Using Settings (' + esc(sd.daysLabel) + '). Tick days to override.' : 'Untick all to go back to Settings.') + '</span></div>' +
        '<div class="grid2"><div class="f"><label>Follow-up email after (business days)</label><input name="followUpDays" type="number" min="1" max="30" value="' + esc(raw['Follow Up Days'] === '' ? '' : raw['Follow Up Days']) + '" placeholder="' + sd.followUpDays + ' (Settings)"' + dis + '><span class="sub">One follow-up, same thread. Never a third.</span></div>' +
        '<div class="f"><label>Call plan: call after (business days)</label><input name="callAfterDays" type="number" min="0" max="60" value="' + esc(raw['Call After Days'] === '' ? '' : raw['Call After Days']) + '" placeholder="blank = no call step"' + dis + '><span class="sub">Anyone who has not replied by then lands on Today\'s call list. Replies get a call right away regardless.</span></div></div>' +
        '<div class="f"><label>Visit step: stop by the office after (business days)</label><input name="visitAfterDays" type="number" min="0" max="90" value="' + esc(raw['Visit After Days'] === undefined || raw['Visit After Days'] === '' ? '' : raw['Visit After Days']) + '" placeholder="blank = no visit step"' + dis + '><span class="sub">Each office with people in this campaign lands on Today\'s Visits list that many days after their first email, until someone logs a visit there.</span></div>' +
        '<div class="f"><label>Tags</label><div id="schedTags"></div><span class="sub">How the Campaigns page files it. Type a word and press Enter; three or four is plenty.</span></div>' +
        '<div class="f"><label>Notes</label><textarea name="notes" style="min-height:60px"' + dis + '>' + esc(c.notes) + '</textarea></div>' +
        '<div class="sub">A person presses Send on Today. The plan only says what will be offered.</div></form></div>' +
        '<div class="card"><div class="hd"><h2>Drawn out</h2><span class="sub">from today, at this cap</span></div>' +
        (plan.days.length ? '<div class="scroll-x"><table><thead><tr><th>Day</th><th class="num">First emails</th><th class="num">Follow-ups</th><th class="num">Calls due</th></tr></thead><tbody>' + plan.days.slice(0, 40).map(function (d, i) { var cell = function (n, kind) { return '<td class="num">' + (n ? '<a href="#" class="plan-who" data-day="' + i + '" data-kind="' + kind + '" title="Who">' + n + '</a>' : '—') + '</td>'; }; return '<tr>' + '<td>' + esc(d.weekday) + ' ' + fmtDate(d.date) + '</td>' + cell(d.firsts, 'firsts') + cell(d.followUps, 'followUps') + cell(d.calls, 'calls') + '</tr>'; }).join('') + (plan.days.length > 40 ? '<tr><td colspan="4" class="sub">… ' + (plan.days.length - 40) + ' more days</td></tr>' : '') + '</tbody></table></div>' +
          '<div id="planWho" style="display:none;border-top:1px solid var(--line)"><div class="hd"><h3 id="planWhoTitle" style="margin:0"></h3><div class="spacer"></div><button class="btn sm ghost" type="button" id="planWhoClose">✕</button></div><ul class="list" id="planWhoList" style="max-height:360px;overflow:auto"></ul></div>' +
          '<div class="bd sub">' + plan.firstsLeft + ' first emails left' + (plan.followUpsQueued ? ', ' + plan.followUpsQueued + ' follow-ups queued' : '') + '. Finishes about <b>' + fmtDate(plan.finish) + '</b>. Capped by what the mailbox can still send each day.</div>' :
          '<div class="empty">' + (plan.cap ? 'Nothing left to send.' : 'Daily cap is 0, or no sending days.') + '</div>') + '</div></div>';
      $('tab-schedule').innerHTML = html;
      schedTags = tagEditor($('schedTags'), c.tags, function () { markDirty(); });
      if (!isAdmin) $('schedTags').querySelector('.tag-input').style.display = 'none';
      on($('tab-schedule'), 'click', function (e) { var ch = e.target.closest('label.chip'); if (ch && ch.querySelector('input') && isAdmin) { setTimeout(function () { ch.classList.toggle('on', ch.querySelector('input').checked); markDirty(); }, 0); } });
      on($('schedForm'), 'input', markDirty);
      on($('schedForm'), 'submit', function (e) { e.preventDefault(); saveAll(); });
      on($('tab-schedule'), 'click', function (e) {
        var a = e.target.closest('a.plan-who'); if (!a) return;
        e.preventDefault();
        var d = plan.days[parseInt(a.dataset.day, 10)], kind = a.dataset.kind, ids = (d.who || {})[kind] || [];
        var label = { firsts: 'first emails', followUps: 'follow-ups', calls: 'calls due' }[kind];
        $('planWhoTitle').textContent = ids.length + ' ' + label + ' · ' + d.weekday + ' ' + fmtDate(d.date);
        $('planWhoList').innerHTML = ids.length ? ids.map(function (pid) { var p = (plan.people || {})[pid] || { name: pid }; return '<li class="link" data-id="' + esc(pid) + '"><div style="flex:1;min-width:0"><div class="name">' + esc(p.name) + '</div><div class="sub">' + esc(p.company || '') + (p.area ? ' · ' + esc(p.area) : '') + '</div></div><span class="sub">›</span></li>'; }).join('') : '<li class="empty">Nobody.</li>';
        $('planWho').style.display = '';
        $('planWho').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      on($('planWhoClose'), 'click', function () { $('planWho').style.display = 'none'; });
      on($('planWhoList'), 'click', function (e) { var li = e.target.closest('li[data-id]'); if (li) go('partner', { id: li.dataset.id, from: 'prospects' }); });
    }

    // ---- results ----
    function renderResults() {
      var rows = results.rows;
      var count = function (f) { return rows.filter(f).length; };
      var filters = [['all', 'All', function () { return true; }], ['replied', 'Replied', function (r) { return !!r.repliedAt; }], ['noreply', 'No reply', function (r) { return r.sentAt && !r.repliedAt && r.response !== 'Bounced'; }], ['bounced', 'Bounced', function (r) { return r.response === 'Bounced'; }], ['unsent', 'Not sent yet', function (r) { return !r.sentAt; }]];
      var f = filters.filter(function (x) { return x[0] === resultFilter; })[0] || filters[0];
      var shown = rows.filter(f[2]);
      var html = '<div class="card"><div class="hd"><h2>Everyone, one line each</h2><div class="spacer"></div>' + filters.map(function (x) { return '<button class="chip ' + (x[0] === resultFilter ? 'on' : '') + '" data-filter="' + x[0] + '">' + x[1] + ' · ' + count(x[2]) + '</button>'; }).join('') + '<button class="btn sm" id="csvBtn">⬇ Export CSV</button></div>' +
        '<div class="scroll-x"><table class="tight"><thead><tr>' + (multi() ? '<th>Wording</th>' : '') + '<th>Name</th><th>Company</th><th>Sent</th><th>Follow-up</th><th>Replied</th><th>Response</th><th>Calls</th></tr></thead><tbody>' +
        (shown.length ? shown.map(function (r) {
          var fu = r.followUp ? (r.followUp.status === 'sent' ? fmtDate(r.followUp.at) : r.followUp.status === 'queued' ? '<span class="sub">due ' + fmtDate(r.followUp.at) + '</span>' : '<span class="sub">' + esc(r.followUp.status) + '</span>') : '—';
          var resp = r.response ? responsePill(r.response) : '';
          var calls = r.calls ? r.calls + (r.lastCall ? ' · ' + esc(String(r.lastCall.outcome || '').replace('_', ' ')) : '') : '—';
          if (r.repliedAt && !r.calls) calls += ' <span class="pill bad">call back</span>';
          return '<tr class="link" data-id="' + esc(r.ID) + '">' + (multi() ? '<td>' + verBadge(r.Version) + '</td>' : '') + '<td>' + esc(r.Name) + (r.doNotContact ? ' <span class="pill bad">DNC</span>' : '') + '</td><td>' + esc(r.Company || '') + '</td><td>' + (fmtDate(r.sentAt) || '—') + '</td><td>' + fu + '</td><td>' + (fmtDate(r.repliedAt) || '—') + '</td><td>' + resp + '</td><td>' + calls + '</td></tr>';
        }).join('') : '<tr><td colspan="8" class="empty">Nobody here.</td></tr>') + '</tbody></table></div></div>';
      $('tab-results').innerHTML = html;
      on($('tab-results'), 'click', function (e) {
        var fb = e.target.closest('[data-filter]'); if (fb) { resultFilter = fb.dataset.filter; renderResults(); return; }
        var tr = e.target.closest('tr[data-id]'); if (tr) go('partner', { id: tr.dataset.id, from: 'prospects' });
      });
      on($('csvBtn'), 'click', function () {
        var head = ['ID', 'Name', 'Company', 'Area', 'Email', 'Letter', 'Rep', 'Sent', 'Follow-up', 'Follow-up status', 'Replied', 'Response', 'Calls', 'Last call', 'Do not contact'];
        var lines = [head].concat(rows.map(function (r) { return [r.ID, r.Name, r.Company, r.Area, r.Email, r.Version, r.Rep, r.sentAt, r.followUp ? r.followUp.at : '', r.followUp ? r.followUp.status : '', r.repliedAt, r.response, r.calls, r.lastCall ? r.lastCall.outcome : '', r.doNotContact ? 'Yes' : '']; }));
        var csv = lines.map(function (l) { return l.map(function (v) { v = String(v === null || v === undefined ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\n');
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = (results.campaign || 'campaign').replace(/[^\w]+/g, '-') + '-results.csv'; a.click();
      });
    }
    function loadResults() { $('tab-results').innerHTML = '<div class="empty">Loading…</div>'; api('campaignResults', id).then(function (r) { results = r; $('nRes').textContent = r.rows.length; renderResults(); }).catch(fail); }

    // ---- save (filters + schedule), status ----
    var dirty = false, schedTags = null;
    function markDirty() { dirty = true; $('saveAll').style.display = isAdmin ? '' : 'none'; }
    function saveFilters() {
      if (!$('audLists')) return Promise.resolve();
      return api('saveCampaign', id, { lists: picked($('audLists')).concat(picked($('audSources'))).concat($('audEarlier') ? picked($('audEarlier')) : []), stages: picked($('audStages')), versions: picked($('audLetters')) });
    }
    function saveAll() {
      var payload = {};
      var sf = $('schedForm');
      if (sf) { payload.startDate = sf.startDate.value; payload.dailyCap = sf.dailyCap.value; payload.followUpDays = sf.followUpDays.value; payload.callAfterDays = sf.callAfterDays.value; payload.visitAfterDays = sf.visitAfterDays.value; payload.notes = sf.notes.value; payload.tags = schedTags ? schedTags.get() : undefined; payload.sendingDays = picked($('schedDays')).join(','); }
      if ($('audLists')) { payload.lists = picked($('audLists')).concat(picked($('audSources'))).concat($('audEarlier') ? picked($('audEarlier')) : []); payload.stages = picked($('audStages')); payload.versions = picked($('audLetters')); }
      busy($('saveAll'), true, 'Saving…');
      api('saveCampaign', id, payload).then(function () { toast('Saved', 'success'); stampSaved($('savedStamp')); dirty = false; load(); }).catch(fail).finally(function () { busy($('saveAll'), false, '💾 Save'); });
    }
    $('saveAll').onclick = saveAll;
    on($('sendNowBtn'), 'click', function () {
      api('buildTodayBatch', { campaignId: id, force: true }).then(function (b) {
        var n = (b.followUps || []).length + (b.firsts || []).length;
        var real = b.problems.filter(function (p) { return !/not a sending day/.test(p); });
        if (real.length) return toast(real[0], 'error');
        if (!n) return toast('Nothing to send: everyone in this campaign has been emailed, or the daily cap is used up.', 'error');
        if (!confirm('Send ' + n + ' email' + (n === 1 ? '' : 's') + ' from this campaign now, from the business mailbox?')) return;
        busy($('sendNowBtn'), true, 'Sending…');
        api('sendCampaignNow', id).then(function (r) {
          if (r.problems && r.problems.length) return toast(r.problems[0], 'error');
          toast('Sent ' + r.sent + (r.followUps ? ' + ' + r.followUps + ' follow-ups' : '') + (r.errors.length ? ' · ' + r.errors.length + ' failed' : ''), r.errors.length ? 'error' : 'success');
          if (r.errors.length) alert(r.errors.join('\n'));
          load();
        }).catch(fail).finally(function () { busy($('sendNowBtn'), false, '📨 Send now'); });
      }).catch(fail);
    });
    on($('dupBtn'), 'click', function () {
      var name = prompt('Name for the copy:', data.campaign.name + ' (copy)'); if (!name) return;
      busy($('dupBtn'), true, '…');
      api('duplicateCampaign', id, { name: name }).then(function (r) { toast('Copied. Pick its list on the Audience tab.', 'success'); go('campaign', { id: r.id }); }).catch(fail).finally(function () { busy($('dupBtn'), false, '⧉ Duplicate'); });
    });
    on($('doneBtn'), 'click', function () {
      if (!confirm('Mark "' + data.campaign.name + '" as done? It leaves Today and the default Campaigns view. Its numbers and results stay.')) return;
      api('saveCampaign', id, { status: 'done' }).then(function () { toast('Filed as done', 'success'); load(); }).catch(fail);
    });
    on($('statusBtn'), 'click', function () {
      var n = nextStatus(data.campaign.status); if (!n) return;
      if (n.to === 'running' && !confirm('Start sending? From the next sending day this campaign shows on Today, and its letters lock at the first send.')) return;
      busy($('statusBtn'), true, '…');
      api('saveCampaign', id, { status: n.to }).then(function () { toast(n.to === 'running' ? 'Running' : 'Paused', 'success'); load(); }).catch(fail).finally(function () { busy($('statusBtn'), false, n.label); });
    });

    function load() {
      api('getCampaign', id).then(function (d) {
        data = d; results = null;
        var c = d.campaign;
        $('titleName').textContent = c.name;
        $('titlePills').innerHTML = statusPill(c.status) + ' <span class="sub">' + esc(c.typeLabel) + (c.firstSentAt ? ' · started ' + fmtDate(c.firstSentAt) : c.startDate ? ' · starts ' + fmtDate(c.startDate) : '') + '</span>' + c.tags.map(function (t) { return ' <span class="pill" style="font-size:11px">' + esc(t) + '</span>'; }).join('');
        var n = nextStatus(c.status);
        $('statusBtn').style.display = isAdmin && n ? '' : 'none'; if (n) $('statusBtn').textContent = n.label;
        $('sendNowBtn').style.display = isAdmin && c.status === 'running' ? '' : 'none';
        $('dupBtn').style.display = isAdmin ? '' : 'none';
        $('doneBtn').style.display = isAdmin && c.status !== 'done' && c.status !== 'draft' ? '' : 'none';
        $('saveAll').style.display = 'none';
        $('nAud').textContent = c.audience; $('nCopy').textContent = c.versions.length; $('nCopy').style.display = c.versions.length > 1 ? '' : 'none';
        renderOverview(); renderAudience(); renderCopy(); renderSchedule();
        var want = null; try { want = localStorage.getItem('cp-tab-' + id); } catch (err) {}
        var cur = $('tabs').querySelector('button.on');
        if (want && want !== cur.dataset.tab) { var b = $('tabs').querySelector('button[data-tab="' + want + '"]'); if (b) b.click(); }
        else if (cur.dataset.tab === 'results') loadResults();
        if (isAdmin && c.status === 'draft' && c.dealt === 0 && !want) { $('tabs').querySelector('button[data-tab="audience"]').click(); }
      }).catch(function (e) { $('tab-overview').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
    }
    load();
  })();
</script>
