<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ArmorTex Outreach<?= isDev ? ' (dev)' : '' ?></title>
  <?!= include('styles') ?>
</head>
<body class="<?= isDev ? 'dev-bench' : '' ?>">
<script>
  // Server-injected context. Every page reads from here; no extra round-trip.
  window.OUTREACH = {
    appUrl: '<?= appUrl ?>',
    appDevUrl: '<?= appDevUrl ?>',
    isDev: <?= isDev ? 'true' : 'false' ?>,
    page: '<?= page ?>',
    side: '<?= side ?>',
    recordId: '<?= recordId ?>',
    version: 'v<?= appVersion ?> · <?= appBuildDate ?>',
    session: <?!= JSON.stringify(session || {}) ?>,
    profiles: <?!= JSON.stringify(profiles || {}) ?>,
    winResponses: <?!= JSON.stringify(winResponses || []) ?>,
    noAccess: <?!= JSON.stringify(noAccess || null) ?>
  };
</script>
<?!= include('script') ?>

<? if (noAccess) { ?>
  <?!= include('noaccess', { noAccess: noAccess, appUrl: appUrl }) ?>
<? } else { ?>

<header class="top">
  <a class="brand" href="<?= appUrl ?>?page=today"><span class="logo">⛨</span><span class="brand-text">ArmorTex <span class="sub-brand">Outreach</span></span><? if (isDev) { ?><span class="dev-tag" title="This is the /dev test bench: the last clasp push, not the version Tanner uses">DEV</span><? } ?></a>
  <div class="side-switch" role="tablist" aria-label="Side">
    <a role="tab" class="<?= side === 'partners' ? 'on' : '' ?>" href="<?= appUrl ?>?page=<?= page === 'homes' || page === 'home' ? 'partners' : page ?>&side=partners">Partners</a>
    <a role="tab" class="<?= side === 'homes' ? 'on' : '' ?>" href="<?= appUrl ?>?page=<?= page === 'partners' || page === 'partner' ? 'homes' : page ?>&side=homes">Homes</a>
  </div>
  <div class="spacer"></div>
  <div class="user" title="<?= session.email ?>">
    <span class="who"><b><?= session.name ?></b><span><?= session.roleLabel ?></span></span>
    <span class="avatar" id="userAvatar"></span>
  </div>
</header>

<div class="layout">
  <nav class="nav" id="nav">
    <? var listPage = (side === 'homes') ? 'homes' : 'partners'; var listLabel = (side === 'homes') ? 'Homes' : 'Partners'; ?>
    <a href="<?= appUrl ?>?page=today&side=<?= side ?>" class="<?= page === 'today' ? 'active' : '' ?>"><i>☀️</i><span>Today</span></a>
    <a href="<?= appUrl ?>?page=<?= listPage ?>&side=<?= side ?>" class="<?= (page === listPage || page === 'partner' || page === 'home') ? 'active' : '' ?>"><i><?= side === 'homes' ? '🏠' : '🤝' ?></i><span><?= listLabel ?></span></a>
    <a href="<?= appUrl ?>?page=campaign&side=<?= side ?>" class="<?= page === 'campaign' ? 'active' : '' ?>"><i>📊</i><span>Campaign</span></a>
    <? if (session.allowedPages.indexOf('settings') !== -1) { ?>
    <a href="<?= appUrl ?>?page=settings&side=<?= side ?>" class="<?= page === 'settings' ? 'active' : '' ?>"><i>⚙️</i><span>Settings</span></a>
    <? } ?>
    <div class="nav-foot"><?= 'v' + appVersion ?> · <?= appBuildDate ?><?= isDev ? ' · DEV' : '' ?></div>
  </nav>

  <main class="content" id="content">
    <? if (page === 'today') { ?><?!= include('today') ?>
    <? } else if (page === 'partners') { ?><?!= include('partners') ?>
    <? } else if (page === 'partner') { ?><?!= include('partner') ?>
    <? } else if (page === 'homes' || page === 'home') { ?><?!= include('homes') ?>
    <? } else if (page === 'campaign') { ?><?!= include('campaign') ?>
    <? } else if (page === 'settings') { ?><?!= include('settings') ?>
    <? } ?>
  </main>
</div>

<? if (session.role === 'owner') { ?>
<!-- Owner tools (from SFM's sidebar footer): 💬 Comment · 🔧 Dev Mode · 🔗 Links: /dev|/exec -->
<div id="ownerTools" class="owner-tools">
  <div class="ot-panel" id="otPanel">
    <? if (canComment) { ?><button type="button" onclick="if (window.openCommentMode) openCommentMode();">💬 Comment <span class="ot-count" id="commentCount" style="display:none"></span></button><? } ?>
    <button type="button" id="otDevMode" onclick="_toggleDevMode()">🔧 Dev Mode</button>
    <button type="button" id="otDevLinks" onclick="_toggleDevLinks()" title="Which copy of the app the links point at. /dev = last clasp push (test bench). /exec = the deployed version Tanner uses.">🔗 Links: /exec</button>
    <div class="ot-foot">v<?= appVersion ?> · <?= isDev ? 'on /dev' : 'on /exec' ?></div>
  </div>
  <button type="button" class="ot-toggle" id="otToggle" title="Owner tools" onclick="toggleOwnerTools()">🛠</button>
</div>
<script>
  window.toggleOwnerTools = function () { var p = document.getElementById('otPanel'); p.classList.toggle('show'); };
  window.closeOwnerTools = function () { document.getElementById('otPanel').classList.remove('show'); };
  (function () {
    var dm = document.getElementById('otDevMode');
    if (dm && isDevMode()) { dm.textContent = '🔧 Dev Mode: ON'; dm.classList.add('on'); }
    var dl = document.getElementById('otDevLinks');
    if (dl && useDevLinks()) { dl.textContent = '🔗 Links: /dev'; dl.classList.add('on'); }
  })();
  window._toggleDevMode = function () {
    var cur = isDevMode();
    if (!confirm(cur ? 'Turn OFF Dev Mode? The page reloads.' : 'Turn ON Dev Mode? Preview UIs may show. The page reloads.')) return;
    setDevMode(!cur);
  };
  window._toggleDevLinks = function () {
    var on = !useDevLinks();
    if (on && window.APP_DEV_URL === window.APP_EXEC_URL) { alert('No /dev URL is set. Add it under Settings → Developer (Apps Script editor → Deploy → Test deployments).'); return; }
    setDevLinks(on);
    window.top.location.href = window.APP_URL + '?page=<?= page ?>&side=<?= side ?><?= recordId ? '&id=' + recordId : '' ?>';
  };
</script>
<? } ?>
<? if (canComment) { ?><?!= include('comments') ?><? } ?>

<div class="toast" id="toast"></div>
<script>
  (function () {
    var s = window.OUTREACH.session || {};
    var el = document.getElementById('userAvatar');
    if (el) el.textContent = (s.name || '?').split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
  })();
</script>
<? } ?>
</body>
</html>
