<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ArmorTex Outreach<?= isDev ? ' (dev)' : '' ?></title>
  <?!= include('ui_base') ?>
  <?!= include('styles') ?>
</head>
<body class="<?= isDev ? 'dev-bench' : '' ?>">
<script>
  // Server-injected context. Every page reads from here; no extra round-trip.
  window.OUTREACH = {
    appUrl: '<?= appUrl ?>',
    appDevUrl: '<?= appDevUrl ?>',
    isDev: <?= isDev ? 'true' : 'false' ?>,
    page: '<?= page ?>',
    section: '<?= section ?>',
    side: '<?= side ?>',
    recordId: '<?= recordId ?>',
    version: 'v<?= appVersion ?> · <?= appBuildDate ?>',
    session: <?!= JSON.stringify(session || {}) ?>,
    profiles: <?!= JSON.stringify(profiles || {}) ?>,
    quo: <?!= JSON.stringify(quo || {}) ?>,
    winResponses: <?!= JSON.stringify(winResponses || []) ?>,
    noAccess: <?!= JSON.stringify(noAccess || null) ?>
  };
</script>
<?!= include('script') ?>

<? if (noAccess) { ?>
  <?!= include('noaccess', { noAccess: noAccess, appUrl: appUrl }) ?>
<? } else { ?>
<? var sideSwitch = '<div class="side-switch" role="tablist" aria-label="Side">'
  + '<a role="tab" class="' + (side === 'partners' ? 'on' : '') + '" href="' + appUrl + '?page=' + ((page === 'homes' || page === 'home') ? 'marketing' : page) + '&side=partners">Partners</a>'
  + '<a role="tab" class="' + (side === 'homes' ? 'on' : '') + '" href="' + appUrl + '?page=' + ((page === 'partners' || page === 'partner' || page === 'marketing') ? 'homes' : page) + '&side=homes">Homes</a>'
  + '</div>'; ?>

<!-- phone top bar (hidden on desktop) -->
<header class="top">
  <a class="brand" href="<?= appUrl ?>?page=today"><span class="logo">⛨</span>ArmorTex<? if (isDev) { ?><span class="dev-tag">DEV</span><? } ?></a>
  <?!= sideSwitch ?>
  <div class="spacer"></div>
  <span class="avatar" id="userAvatarTop"></span>
</header>

<div class="layout">
  <nav class="nav" id="nav">
    <div class="brand"><span class="logo">⛨</span>ArmorTex Outreach<? if (isDev) { ?><span class="dev-tag" title="This is the /dev test bench: the last clasp push, not the version Tanner uses">DEV</span><? } ?></div>
    <?!= sideSwitch ?>
    <div class="links">
      <a href="<?= appUrl ?>?page=today&side=<?= side ?>" class="<?= page === 'today' ? 'active' : '' ?>"><i>☀️</i><span>Today</span></a>
      <? if (side === 'homes') { ?>
      <a href="<?= appUrl ?>?page=homes&side=homes" class="<?= (page === 'homes' || page === 'home') ? 'active' : '' ?>"><i>🏠</i><span>Homes</span></a>
      <? } else { ?>
      <a href="<?= appUrl ?>?page=marketing&side=partners" class="<?= (page === 'marketing' || (page === 'partner' && section === 'marketing')) ? 'active' : '' ?>"><i>📣</i><span>Marketing</span></a>
      <a href="<?= appUrl ?>?page=partners&side=partners" class="<?= (page === 'partners' || (page === 'partner' && section === 'partners')) ? 'active' : '' ?>"><i>🤝</i><span>Partners</span></a>
      <a href="<?= appUrl ?>?page=lists&side=partners" class="<?= page === 'lists' ? 'active' : '' ?>"><i>📋</i><span>Lists</span></a>
      <? } ?>
      <a href="<?= appUrl ?>?page=campaigns&side=<?= side ?>" class="<?= (page === 'campaigns' || page === 'campaign') ? 'active' : '' ?>"><i>📊</i><span>Campaigns</span></a>
      <? if (session.allowedPages.indexOf('settings') !== -1) { ?>
      <a href="<?= appUrl ?>?page=settings&side=<?= side ?>" class="own <?= page === 'settings' ? 'active' : '' ?>" title="Owner only"><i>⚙️</i><span>Settings</span></a>
      <? } ?>
    </div>
    <? if (session.role === 'owner') { ?><div class="own-legend">purple = only you see this</div><? } ?>
    <div class="user">
      <span class="avatar" id="userAvatar"></span>
      <span><b><?= session.name ?></b><?= session.roleLabel ?></span>
    </div>
    <? if (session.role === 'owner') { ?>
    <div class="nav-tools">
      <? if (canComment) { ?><a href="#" onclick="if (window.openCommentMode) openCommentMode(); return false;" title="Pin a comment to anything on this page">💬 Comment<span class="cnt comment-count" style="display:none"></span></a><? } ?>
      <a href="#" id="navDevMode" onclick="_toggleDevMode(); return false;">🔧 Dev Mode</a>
      <a href="#" id="navDevLinks" onclick="_toggleDevLinks(); return false;" title="Which copy of the app the links point at. /dev = last clasp push (test bench). /exec = the deployed version Tanner uses.">🔗 Links: /exec</a>
    </div>
    <? } ?>
    <div class="nav-foot">v<?= appVersion ?> · <?= appBuildDate ?><?= isDev ? ' · DEV' : '' ?></div>
  </nav>

  <main class="content" id="content">
    <? if (page === 'today') { ?><?!= include('today') ?>
    <? } else if (page === 'partners') { ?><?!= include('partners', { section: 'partners', appUrl: appUrl }) ?>
    <? } else if (page === 'marketing') { ?><?!= include('partners', { section: 'marketing', appUrl: appUrl }) ?>
    <? } else if (page === 'partner') { ?><?!= include('partner', { section: section }) ?>
    <? } else if (page === 'homes' || page === 'home') { ?><?!= include('homes') ?>
    <? } else if (page === 'lists') { ?><?!= include('lists') ?>
    <? } else if (page === 'campaigns') { ?><?!= include('campaigns') ?>
    <? } else if (page === 'campaign') { ?><?!= include('campaign') ?>
    <? } else if (page === 'settings') { ?><?!= include('settings') ?>
    <? } ?>
  </main>
</div>

<? if (session.role === 'owner') { ?>
<!-- Owner tools on phones (desktop has them in the sidebar footer) -->
<div id="ownerTools" class="owner-tools">
  <div class="ot-panel" id="otPanel">
    <? if (canComment) { ?><button type="button" onclick="if (window.openCommentMode) openCommentMode();">💬 Comment <span class="ot-count comment-count" style="display:none"></span></button><? } ?>
    <button type="button" id="otDevMode" onclick="_toggleDevMode()">🔧 Dev Mode</button>
    <button type="button" id="otDevLinks" onclick="_toggleDevLinks()">🔗 Links: /exec</button>
    <div class="ot-foot">v<?= appVersion ?> · <?= isDev ? 'on /dev' : 'on /exec' ?></div>
  </div>
  <button type="button" class="ot-toggle" id="otToggle" title="Owner tools" onclick="toggleOwnerTools()">🛠</button>
</div>
<script>
  window.toggleOwnerTools = function () { document.getElementById('otPanel').classList.toggle('show'); };
  window.closeOwnerTools = function () { document.getElementById('otPanel').classList.remove('show'); };
  (function () {
    ['otDevMode', 'navDevMode'].forEach(function (id) { var el = document.getElementById(id); if (el && isDevMode()) { el.textContent = '🔧 Dev Mode: ON'; el.classList.add('on'); } });
    ['otDevLinks', 'navDevLinks'].forEach(function (id) { var el = document.getElementById(id); if (el && useDevLinks()) { el.textContent = '🔗 Links: /dev'; el.classList.add('on'); } });
  })();
  window._toggleDevMode = function () {
    var cur = isDevMode();
    if (!confirm(cur ? 'Turn OFF Dev Mode? The page reloads.' : 'Turn ON Dev Mode? Preview UIs may show. The page reloads.')) return;
    setDevMode(!cur);
  };
  window._toggleDevLinks = function () {
    var on = !useDevLinks();
    if (on && window.APP_DEV_URL === window.APP_EXEC_URL) { alert('No /dev URL is set. Add it under Settings → Developer (Apps Script editor → Deploy → Test deployments).'); return; }
    setDevLinks(on);
    window.top.location.href = window.APP_URL + '?page=<?= page ?>&side=<?= side ?><?= recordId ? '&id=' + recordId : '' ?>';
  };
</script>
<? } ?>
<? if (canComment) { ?><?!= include('comments') ?><? } ?>

<div id="toast"></div>
<script>
  (function () {
    var s = window.OUTREACH.session || {};
    var ini = (s.name || '?').split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
    ['userAvatar', 'userAvatarTop'].forEach(function (id) { var el = document.getElementById(id); if (el) el.textContent = ini; });
  })();
</script>
<? } ?>
</body>
</html>
