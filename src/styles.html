<style>
  /* ArmorTex Outreach — layered on ui_base.html (the SFM suite base, see docs/UI_CONVENTIONS.md).
     Palette (rule 44): ink #1c2433 · text #374151 · muted #6b7280 · faint #9ca3af · lines #e5e7eb · page #f3f4f6 · card #fff
     brand #2E75B6 (hover #235d92) · success #047857 · warning #b45309 on #fef3c7 · danger #b91c1c · owner-only #4c1d95 · dev bench #c2410c on #fff7ed */
  :root{
    --ink:#1c2433; --text:#374151; --muted:#6b7280; --faint:#9ca3af; --line:#e5e7eb; --bg:#f3f4f6; --card:#fff;
    --brand:#2E75B6; --brand-2:#235d92; --brand-bg:#f0f6fc; --ok:#047857; --ok-bg:#d1fae5; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
    --own:#4c1d95; --own-bg:#f3eeff; --dev:#c2410c; --dev-bg:#fff7ed; --orange:#c2410c;
    --nav-w:220px; --mobile-nav-h:60px; --topbar-h:52px;
  }
  html,body{font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);overflow-x:hidden}
  h1{font-size:22px;margin:0 0 16px;color:var(--ink)}
  h2{font-size:15px;margin:0;color:var(--ink)}
  a{color:inherit;text-decoration:none}
  a:hover{text-decoration:none}
  .hidden{display:none !important}
  .spacer{flex:1}
  .muted{color:var(--muted)}
  .sub{color:var(--muted);font-size:13px}
  .small{font-size:12px}
  .hint{display:block;font-size:11px;color:var(--muted);margin-top:4px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-word;background:#f9fafb;border:1px dashed var(--line);border-radius:6px;padding:10px 12px}

  /* ---------- layout: white 220px sidebar (30), content ---------- */
  .layout{display:flex;min-height:100vh}
  .nav{width:var(--nav-w);flex:none;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
  .nav .brand{flex:none;padding:18px 20px 14px;font-weight:800;font-size:14px;letter-spacing:.6px;color:var(--ink);border-bottom:1px solid var(--line);text-transform:uppercase;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .nav .brand .logo{width:22px;height:22px;border-radius:5px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;margin-right:4px}
  .side-switch{display:flex;flex:none;margin:12px 14px 6px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .side-switch a{flex:1;text-align:center;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);background:#fff}
  .side-switch a.on{background:var(--brand);color:#fff}
  .nav .links{display:flex;flex-direction:column;padding:6px 0;flex:none}
  .nav .links a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--text);font-weight:500;font-size:14px;border-left:3px solid transparent}
  .nav .links a i{font-style:normal;width:20px;text-align:center;font-size:15px}
  .nav .links a:hover{background:var(--bg);color:var(--ink)}
  .nav .links a.active{background:var(--brand-bg);color:var(--ink);font-weight:600;border-left-color:var(--brand)}
  .nav .links a.own{background:var(--own-bg);color:var(--own);box-shadow:inset 3px 0 0 #c4b5fd;border-left-color:transparent}
  .nav .links a.own.active{background:#ddd6fe;color:#3b0764;box-shadow:inset 3px 0 0 #6d28d9}
  .nav .own-legend{margin:4px 20px 0;font-size:11px;color:var(--own)}
  .nav .user{margin-top:auto;padding:10px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .nav .user b{display:block;color:var(--ink);font-size:13px}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
  /* owner tools (53): orange, at the bottom of the sidebar */
  .nav-tools{display:flex;flex-direction:column;padding:6px 0;border-top:1px solid var(--line)}
  .nav-tools a{padding:6px 20px;font-size:12px;color:var(--orange);font-weight:500}
  .nav-tools a:hover{background:var(--dev-bg)}
  .nav-tools a.on{background:var(--dev-bg);font-weight:700}
  .nav-tools a .cnt{display:inline-block;min-width:18px;text-align:center;background:var(--orange);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 5px;margin-left:6px}
  /* version (52): monospace, with the build date */
  .nav-foot{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--faint);padding:8px 20px 14px}
  .content{flex:1;min-width:0;padding:24px 28px 80px;max-width:1180px}

  /* mobile: top bar + bottom tabs (the suite has no phone layout; Tanner works from his truck) */
  .top{display:none}
  @media (max-width:760px){
    .layout{display:block}
    .top{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
    .top .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.4px;color:var(--ink);text-transform:uppercase}
    .top .brand .logo{width:24px;height:24px;border-radius:5px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px}
    .top .side-switch{margin:0;flex:none}
    .top .side-switch a{padding:5px 10px}
    .nav{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:var(--mobile-nav-h);flex-direction:row;border-right:0;border-top:1px solid var(--line);z-index:20;overflow:hidden;padding:0 4px calc(env(safe-area-inset-bottom))}
    .nav .brand,.nav .side-switch,.nav .user,.nav-tools,.nav-foot,.nav .own-legend{display:none}
    .nav .links{flex-direction:row;flex:1;padding:0}
    .nav .links a{flex:1;flex-direction:column;justify-content:center;gap:2px;padding:4px 2px;font-size:11px;border-left:0;border-top:3px solid transparent;text-align:center}
    .nav .links a i{width:auto;font-size:18px}
    .nav .links a.active{border-top-color:var(--brand);border-left-color:transparent}
    .nav .links a.own{box-shadow:none;background:transparent;color:var(--own)}
    .content{padding:14px 12px calc(var(--mobile-nav-h) + 24px)}
    h1{font-size:20px}
  }

  /* ---------- test bench (31): amber ---------- */
  .dev-tag{display:inline-block;padding:1px 7px;border-radius:999px;background:#ea580c;color:#fff;font-size:10px;font-weight:800;letter-spacing:.6px;vertical-align:middle}
  body.dev-bench .nav,body.dev-bench .top{background:var(--dev-bg);border-color:#fdba74}
  body.dev-bench .nav .brand{border-bottom-color:#fdba74}
  body.dev-bench .nav .links a:hover{background:#ffedd5}
  body.dev-bench .nav .links a.active{background:#ffedd5;color:#9a3412;border-left-color:#ea580c}
  body.dev-bench .nav-foot{color:var(--dev);font-weight:700}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px 12px}
  .cal-h{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:center;padding:4px 0}
  .cal-h.send{color:var(--navy);font-weight:700}
  .cal-d{min-height:86px;border:1px solid var(--line);border-radius:6px;padding:4px 5px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .cal-d.pad{border:none;background:transparent;cursor:default}
  .cal-d.send{background:#f6f9fd}
  .cal-d.today{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
  .cal-d.on{background:#eef4fb}
  .cal-d .n{font-size:12px;font-weight:700;color:var(--muted)}
  .cal-d.today .n{color:var(--blue)}
  .cchip{display:block;font-size:10.5px;line-height:1.3;padding:1px 5px;border-radius:4px;background:#f1f3f6;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cchip.ok{background:#e8f6ee;color:#17743d}.cchip.warn{background:#fff3e0;color:#b25e00}.cchip.navy{background:#e6edf8;color:var(--navy)}.cchip.more{color:var(--muted);background:transparent}
  @media (max-width:760px){.cal-d{min-height:54px}.cchip{display:none}.cal-d.has::after{content:'•';color:var(--blue);font-size:16px;line-height:1}}
  .content-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .citem{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column}
  .citem .ck{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:4px}
  .citem .ctext{white-space:pre-wrap;margin-top:4px;max-height:5.6em;overflow:hidden}
  .view-as-bar{background:#fef3c7;border:1px solid #f59e0b;color:#78350f;border-radius:8px;padding:8px 14px;margin-bottom:14px;font-size:13px}
  .view-as-bar a{color:#9a3412;font-weight:700;margin-left:8px}

  /* ---------- cards (34) ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:16px;padding:0}
  .card .hd{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .card .bd{padding:20px}
  .card .ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pd-sub{font-size:15px;font-weight:700;color:var(--ink);margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-style:italic}
  .save-note{font-size:12px;color:var(--muted);font-style:italic}

  /* ---------- buttons (39–42): one primary per card, the rest secondary or ghost ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:14px;border-radius:4px;border:1px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap}
  .btn:hover{background:var(--brand-bg);color:var(--brand-2);border-color:var(--brand-2);text-decoration:none}
  .btn.primary,.btn.navy{background:var(--brand);color:#fff}
  .btn.primary:hover,.btn.navy:hover{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
  .btn.ghost{background:transparent;border-color:#d1d5db;color:var(--text)}
  .btn.ghost:hover{background:var(--bg);color:var(--ink)}
  .btn.danger{background:#fff;border-color:#dc2626;color:var(--bad)}
  .btn.danger:hover{background:#fee2e2}
  .btn.sm{padding:5px 10px;font-size:13px}
  .btn.block{width:100%;justify-content:center}
  .btn:disabled,.btn[disabled]{opacity:.5;cursor:not-allowed}
  .ic{display:inline-flex;align-items:center;font-size:17px;line-height:1;padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);cursor:pointer}
  .ic:hover{color:var(--ink);background:var(--bg)}

  /* ---------- forms (1–12) ---------- */
  .f{display:flex;flex-direction:column;margin-bottom:14px}
  .f label{font-size:13px;font-weight:500;color:var(--text);margin-bottom:0}
  .f label .req{color:#dc2626;margin-left:2px}
  .f input,.f select,.f textarea{margin-top:4px}
  .f textarea{min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media (max-width:600px){.grid2{grid-template-columns:1fr}}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d1d5db;border-radius:4px;padding:6px 10px;flex:1;min-width:200px}
  .search input{border:0 !important;outline:0;flex:1;background:transparent;margin:0 !important;padding:2px 0 !important;box-shadow:none !important}
  .inline-input{border:1px solid #d1d5db;border-radius:4px;padding:7px 10px;font-size:14px;background:#fff;font-family:inherit}

  /* chips (filters) and tabs (33) */
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--text);cursor:pointer;font-family:inherit}
  label.chip{display:inline-flex;align-items:center;gap:4px;margin:0}
  .chips{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
  table.tight td{padding-top:6px;padding-bottom:6px}
  .chip:hover{background:var(--bg);color:var(--ink)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  select.chip{padding:5px 8px;display:inline-block;width:auto;margin:0;font-size:12px}
  .inline-input,select.inline-input{display:inline-block;width:auto;margin:0}
  .f input,.f select{min-height:36px}
  .ptabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin:0 0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ptabs button{background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-2px;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:0}
  .ptabs button:hover{background:var(--bg);color:var(--ink)}
  .ptabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600;background:transparent}
  .ptabs .n{display:inline-block;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--bg);font-size:11px;font-weight:600;color:var(--text);text-align:center}
  .ptabs button.on .n{background:var(--brand);color:#fff}

  /* ---------- pills (45): a colour per state, never for decoration ---------- */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;font-size:12px;border-radius:999px;font-weight:500;background:var(--bg);color:var(--muted);white-space:nowrap}
  .pill.ok{background:var(--ok-bg);color:#065f46}
  .pill.bad{background:var(--bad-bg);color:var(--bad)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.navy{background:#dbeafe;color:#1e40af}
  .pill.orange{background:var(--dev-bg);color:var(--dev)}
  .ver{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-weight:700;font-size:12px;background:var(--brand);color:#fff;flex:none}
  .ver.A{background:#1e40af}.ver.B{background:#2E75B6}.ver.C{background:#047857}.ver.E{background:#6d28d9}.ver.none{background:var(--line);color:var(--text)}

  /* ---------- lists + tables (35) ---------- */
  .list{list-style:none;margin:0;padding:0}
  .list li{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid #f0f1f3}
  .list li:last-child{border-bottom:0}
  .list li.link{cursor:pointer}
  .list li.link:hover{background:#fafbfc}
  .list .name{font-weight:600;color:var(--ink)}
  table{font-size:13px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .scroll-x{overflow-x:auto}
  tr.link{cursor:pointer} tr.link:hover td{background:#fafbfc}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
  .stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:6px}
  .stat b{font-size:22px;line-height:1;color:var(--ink)}
  .stat span{font-size:12px;color:var(--muted)}
  .funnel{display:flex;align-items:stretch;gap:6px;margin-bottom:16px;overflow-x:auto}
  .fstep{flex:1;min-width:110px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;color:inherit}
  .fstep b{font-size:22px;line-height:1.1;color:var(--ink)}
  .fstep span{font-size:12px;font-weight:600;color:var(--text)}
  .fstep i{font-style:normal;font-size:11px;color:var(--muted)}
  .fstep.win{background:var(--ok-bg);border-color:#a7f3d0}
  .farrow{align-self:center;color:var(--faint);font-size:18px}
  .problem{background:var(--warn-bg);border:1px solid #fcd34d;color:var(--warn);border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:10px}
  .problem.bad{background:var(--bad-bg);border-color:#fca5a5;color:var(--bad)}
  .ok-box{background:var(--ok-bg);border:1px solid #a7f3d0;color:#065f46;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:10px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px}
  .kv div:nth-child(odd){color:var(--muted)}
  .timeline{list-style:none;margin:0;padding:0}
  .timeline li{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .timeline li:last-child{border-bottom:0}
  .timeline .when{color:var(--muted);font-size:12px}
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .actions .btn{justify-content:center}

  /* sticky title row on a record (32, 18) */
  .title-row{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
  .title-row h1{margin:0;font-size:20px}
  .saved-stamp{font-size:12px;color:var(--muted)}
  @media (max-width:760px){.title-row{top:var(--topbar-h)}}

  details.card summary{padding:12px 20px;cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;color:var(--ink)}
  details.card summary::after{content:'▸';margin-left:auto;color:var(--faint)}
  details.card[open] summary::after{content:'▾'}
  details.card[open] summary{border-bottom:1px solid var(--line)}
  .mock{font-size:10px;font-weight:700;letter-spacing:.6px;background:var(--warn-bg);color:var(--warn);padding:2px 6px;border-radius:999px;vertical-align:middle}
  .notes{margin-top:18px;background:var(--dev-bg);border:1px solid #fed7aa;border-radius:6px;padding:14px 16px;font-size:13px}
  .notes h3{margin:0 0 6px;font-size:13px;color:var(--dev)}
  .notes ol{margin:0;padding-left:18px}
  .notes li{margin:3px 0}

  /* floating owner tools: phones only (desktop has the sidebar footer) */
  .owner-tools{position:fixed;right:14px;bottom:calc(var(--mobile-nav-h) + 14px);z-index:40;display:none;flex-direction:column;align-items:flex-end;gap:8px}
  @media (max-width:760px){.owner-tools{display:flex}}
  .ot-toggle{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--orange);box-shadow:0 1px 2px rgba(0,0,0,.08);font-size:18px;padding:0}
  .ot-panel{display:none;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;min-width:190px}
  .ot-panel.show{display:flex}
  .ot-panel button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:4px;font-weight:500;font-size:13px;color:var(--orange)}
  .ot-panel button:hover{background:var(--dev-bg)}
  .ot-panel button.on{background:var(--dev-bg);font-weight:700}
  .ot-count{display:inline-block;min-width:18px;text-align:center;background:var(--orange);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 5px;margin-left:6px}
  .ot-foot{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--faint);padding:4px 10px 2px;border-top:1px solid var(--line);margin-top:4px}
</style>
