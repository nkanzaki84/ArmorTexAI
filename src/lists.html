<div class="title-row" style="position:static">
  <h1>Lists</h1><span class="sub">named groups of people · campaigns point at them</span>
  <div class="spacer"></div>
  <button class="btn primary" id="newListBtn" style="display:none">+ New list</button>
</div>

<div class="grid2" style="grid-template-columns:300px 1fr;gap:16px;align-items:start" id="listsLayout">
  <div class="card" style="margin:0">
    <div class="hd"><h2>Your lists</h2></div>
    <ul class="list" id="listIndex"><li class="empty">Loading…</li></ul>
  </div>
  <div id="listPane"><div class="card" style="margin:0"><div class="bd empty">Pick a list, or make one.</div></div></div>
</div>

<div class="modal-backdrop" id="listModal">
  <div class="modal">
    <h2 style="margin-top:0" id="listModalTitle">New list</h2>
    <form id="listForm">
      <div class="f"><label>Name <span class="req">*</span></label><input name="name" required placeholder="e.g. Tyler realtors Tanner has met"></div>
      <div class="f"><label>Notes</label><textarea name="notes" style="min-height:60px" placeholder="what this list is for"></textarea></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button type="button" class="btn" id="listCancel">Cancel</button><button type="submit" class="btn primary">Save</button></div>
    </form>
  </div>
</div>

<script>
  (function () {
    var lists = [], current = null, members = [], editing = null, sourceLists = [], preview = null;
    var profiles = O.profiles || {};
    if (canWrite) $('newListBtn').style.display = '';

    function renderIndex() {
      $('listIndex').innerHTML = lists.length ? lists.map(function (l) {
        return '<li class="link ' + (current === l.id ? 'on' : '') + '" data-id="' + esc(l.id) + '" style="' + (current === l.id ? 'background:#eef4fb' : '') + '"><div style="flex:1;min-width:0"><div class="name">' + esc(l.name) + '</div>' + (l.notes ? '<div class="sub">' + esc(l.notes) + '</div>' : '') + '</div><span class="pill">' + l.count + '</span></li>';
      }).join('') : '<li class="empty">No lists yet.' + (canWrite ? ' Press + New list.' : '') + '</li>';
    }
    function renderPane() {
      var l = lists.filter(function (x) { return x.id === current; })[0];
      if (!l) { $('listPane').innerHTML = '<div class="card" style="margin:0"><div class="bd empty">Pick a list, or make one.</div></div>'; return; }
      var typeOpts = '<option value="">any type</option>' + Object.keys(profiles).map(function (k) { return '<option value="' + esc(k) + '">' + esc(profiles[k].plural || profiles[k].label) + '</option>'; }).join('');
      var srcOpts = '<option value="">any import file</option>' + sourceLists.map(function (s) { return '<option value="' + esc(s.sourceList) + '">' + esc(s.sourceList) + ' · ' + s.count + '</option>'; }).join('');
      var html = '<div class="card" style="margin:0 0 16px"><div class="hd"><h2>' + esc(l.name) + '</h2><span class="sub">' + members.length + ' people' + (l.notes ? ' · ' + esc(l.notes) : '') + '</span><div class="spacer"></div>' +
        (canWrite ? '<button class="btn sm" id="editListBtn">Rename</button>' : '') + (isAdmin ? '<button class="btn sm ghost danger" id="deleteListBtn">Delete list</button>' : '') + '</div>' +
        (canWrite ? '<div class="bd" style="border-bottom:1px solid var(--line)"><div class="grid2"><div class="f"><label>Add one person</label><input class="inline-input" id="addOne" placeholder="type a name, brokerage or email…"><div id="addOneHits"></div></div>' +
          '<div class="f"><label>Add everyone who…</label><div class="row"><select class="inline-input" id="fType" style="flex:1">' + typeOpts + '</select><select class="inline-input" id="fSource" style="flex:1">' + srcOpts + '</select></div>' +
          '<div class="row" style="margin-top:6px"><input class="inline-input" id="fArea" placeholder="area contains, e.g. Tyler" style="flex:1"><select class="inline-input" id="fStage" style="flex:1"><option value="">any stage</option><option>Prospect</option><option>Contacted</option><option>Replied</option></select></div>' +
          '<div class="row" style="margin-top:6px"><button class="btn sm" id="previewBtn">Count</button><span class="sub" id="previewNote">The Partners book and do-not-contact are never added this way.</span><button class="btn sm navy" id="addMatchBtn" style="display:none">Add them</button></div></div></div></div>' : '') +
        '<div class="scroll-x"><table class="tight"><thead><tr><th>Name</th><th>Type</th><th>Company</th><th>Area</th><th>Stage</th><th>Campaign</th><th></th></tr></thead><tbody id="memberRows">' +
        (members.length ? members.map(function (m) {
          return '<tr class="link" data-id="' + esc(m.ID) + '"><td>' + esc(m.Name) + (String(m['Do Not Contact']).toLowerCase() === 'yes' ? ' <span class="pill bad">DNC</span>' : '') + '</td><td class="sub">' + esc((profiles[m.Type] || {}).label || m.Type) + '</td><td>' + esc(m.Company || '') + '</td><td>' + esc(m.Area || '') + '</td><td>' + stagePill(m.Stage) + '</td><td class="sub">' + esc(m['Campaign ID'] || '—') + '</td><td>' + (canWrite ? '<button class="btn sm ghost" data-remove="' + esc(m.ID) + '" title="Take off this list">✕</button>' : '') + '</td></tr>';
        }).join('') : '<tr><td colspan="7" class="empty">Nobody on this list yet.</td></tr>') + '</tbody></table></div></div>';
      $('listPane').innerHTML = html;
      if (!canWrite) return;
      on($('editListBtn'), 'click', function () { openModal(l); });
      if ($('deleteListBtn')) on($('deleteListBtn'), 'click', function () { if (!confirm('Delete "' + l.name + '"? People stay in the app; they just come off this list.')) return; api('deleteList', l.id).then(function () { toast('List deleted', 'success'); current = null; loadAll(); }).catch(fail); });
      var t = null;
      on($('addOne'), 'input', function () {
        clearTimeout(t); var q = $('addOne').value.trim();
        if (q.length < 2) { $('addOneHits').innerHTML = ''; return; }
        t = setTimeout(function () {
          api('matchPartners', { q: q, includeBook: true }).then(function (hits) {
            var onList = {}; members.forEach(function (m) { onList[m.ID] = true; });
            $('addOneHits').innerHTML = hits.length ? '<ul class="list" style="margin-top:6px;border:1px solid var(--line);border-radius:6px">' + hits.slice(0, 8).map(function (h) { return '<li style="padding:6px 10px"><div style="flex:1"><b>' + esc(h.Name) + '</b> <span class="sub">' + esc(h.Company || '') + (h.Area ? ' · ' + esc(h.Area) : '') + '</span></div>' + (onList[h.ID] ? '<span class="pill ok">on list</span>' : '<button class="btn sm" data-add="' + esc(h.ID) + '">Add</button>') + '</li>'; }).join('') + '</ul>' : '<div class="sub" style="margin-top:6px">No match.</div>';
          }).catch(fail);
        }, 250);
      });
      on($('addOneHits'), 'click', function (e) { var b = e.target.closest('[data-add]'); if (!b) return; api('addToList', l.id, [b.dataset.add]).then(function () { toast('Added', 'success'); $('addOne').value = ''; $('addOneHits').innerHTML = ''; loadMembers(); }).catch(fail); });
      var filter = function () { return { type: $('fType').value, sourceList: $('fSource').value, area: $('fArea').value, stage: $('fStage').value }; };
      on($('previewBtn'), 'click', function () {
        busy($('previewBtn'), true, '…');
        api('matchPartners', filter()).then(function (hits) {
          var onList = {}; members.forEach(function (m) { onList[m.ID] = true; });
          var fresh = hits.filter(function (h) { return !onList[h.ID]; }).length;
          preview = hits; $('previewNote').innerHTML = '<b>' + hits.length + '</b> match, <b>' + fresh + '</b> not on the list yet.'; $('addMatchBtn').style.display = fresh ? '' : 'none';
        }).catch(fail).finally(function () { busy($('previewBtn'), false, 'Count'); });
      });
      on($('addMatchBtn'), 'click', function () {
        busy($('addMatchBtn'), true, 'Adding…');
        api('addMatchingToList', l.id, filter()).then(function (r) { toast('Added ' + r.added, 'success'); loadMembers(); }).catch(fail).finally(function () { busy($('addMatchBtn'), false, 'Add them'); });
      });
      on($('memberRows'), 'click', function (e) {
        var rm = e.target.closest('[data-remove]'); if (rm) { api('removeFromList', l.id, [rm.dataset.remove]).then(function () { toast('Removed', 'success'); loadMembers(); }).catch(fail); return; }
        var tr = e.target.closest('tr[data-id]'); if (tr) go('partner', { id: tr.dataset.id, from: 'marketing' });
      });
    }
    function loadMembers() {
      if (!current) { renderPane(); return; }
      api('listMembers', current).then(function (m) { members = m; api('listLists').then(function (ls) { lists = ls; renderIndex(); renderPane(); }); }).catch(fail);
    }
    function loadAll() {
      api('listLists').then(function (ls) {
        lists = ls; renderIndex();
        if (!current && ls.length) current = ls[0].id;
        if (current) loadMembers(); else renderPane();
      }).catch(fail);
      api('listSourceLists').then(function (s) { sourceLists = s; }).catch(function () {});
    }
    on($('listIndex'), 'click', function (e) { var li = e.target.closest('li[data-id]'); if (!li) return; current = li.dataset.id; renderIndex(); loadMembers(); });

    function openModal(l) {
      editing = l || null;
      $('listModalTitle').textContent = l ? 'Rename list' : 'New list';
      $('listForm').name.value = l ? l.name : ''; $('listForm').notes.value = l ? l.notes : '';
      $('listModal').classList.add('show'); $('listForm').name.focus();
    }
    on($('newListBtn'), 'click', function () { openModal(null); });
    on($('listCancel'), 'click', function () { $('listModal').classList.remove('show'); });
    on($('listForm'), 'submit', function (e) {
      e.preventDefault();
      var f = e.target, payload = { name: f.name.value, notes: f.notes.value };
      var p = editing ? api('saveList', editing.id, payload) : api('createList', payload);
      p.then(function (r) { $('listModal').classList.remove('show'); if (r && r.id) current = r.id; toast('Saved', 'success'); loadAll(); }).catch(fail);
    });
    var want = (new URLSearchParams(location.search)).get('list'); if (want) current = want;
    loadAll();
  })();
</script>
